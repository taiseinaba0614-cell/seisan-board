<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>生産管理表</title>

  <!-- PWA / iOS ホーム画面追加 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="生産管理" />
  <link rel="apple-touch-icon" href="seisan-icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="seisan-icon-152.png" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #fff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-h: #1d4ed8;
      --today-bg: #eff6ff;
      --weekend-bg: #fefce8;
      --radius: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.4;
    }

    /* ─── Safe area (notch / home bar) ─── */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --header-h: 60px;
    }

    /* ─── Header ─── */
    .header {
      height: calc(var(--header-h) + var(--sat));
      padding-top: var(--sat);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      padding-left: max(16px, calc(var(--sal) + 12px));
      padding-right: max(16px, calc(var(--sar) + 12px));
      position: relative; z-index: 200; box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .header-sep { width: 1px; height: 20px; background: var(--border); }
    .month-nav { display: flex; align-items: center; gap: 5px; }
    .month-label { font-weight: 600; min-width: 120px; text-align: center; font-size: 17px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

    /* Sidebar toggle button */
    .btn-sidebar-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: var(--radius);
      background: transparent; border: none; cursor: pointer; font-size: 19px;
      color: var(--muted); flex-shrink: 0; touch-action: manipulation;
      transition: background .12s;
    }
    .btn-sidebar-toggle:active { background: var(--bg); }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 10px 18px; border-radius: var(--radius); cursor: pointer;
      font-size: 15px; font-weight: 500; border: none; transition: background .12s, transform .08s, opacity .08s;
      white-space: nowrap; font-family: inherit; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active:not(:disabled) { transform: scale(0.96); opacity: 0.85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg); }
    .btn-ghost { background: transparent; color: var(--muted); padding: 9px 11px; }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .btn-danger:hover:not(:disabled) { background: #fca5a5; }
    .btn-icon { padding: 8px 11px; font-size: 17px; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    /* ─── Layout ─── */
    .layout {
      display: flex;
      height: calc(100vh - var(--header-h) - var(--sat));
    }

    /* ─── Install guide banner ─── */
    .install-banner {
      display: none; position: fixed; bottom: calc(16px + var(--sab)); left: 50%;
      transform: translateX(-50%);
      background: #1e293b; color: #fff; border-radius: 14px;
      padding: 14px 18px; z-index: 8000; max-width: calc(100vw - 32px);
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
      flex-direction: column; gap: 6px;
      animation: bannerSlide .3s ease;
    }
    .install-banner.show { display: flex; }
    .install-banner-title { font-size: 14px; font-weight: 700; }
    .install-banner-body { font-size: 13px; opacity: .85; line-height: 1.5; }
    .install-banner-foot { display: flex; justify-content: flex-end; margin-top: 4px; }
    .install-banner-close {
      background: rgba(255,255,255,.15); border: none; color: #fff;
      font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-family: inherit; touch-action: manipulation;
    }
    @keyframes bannerSlide { from { opacity:0; transform: translateX(-50%) translateY(12px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* ─── Sidebar ─── */
    .sidebar {
      width: 260px; min-width: 260px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: width .22s ease, min-width .22s ease;
      padding-bottom: var(--sab);
    }
    .sidebar.collapsed { width: 0; min-width: 0; border-right: none; }
    /* Sidebar backdrop for touch close */
    .sb-backdrop {
      display: none; position: fixed; inset: 0; z-index: 150;
      background: rgba(15,23,42,.3);
    }
    .sb-backdrop.show { display: block; }
    .sb-section { border-bottom: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .sb-section:last-child { border-bottom: none; flex: 1; }
    .sb-head {
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .sb-head-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .sb-count { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 4px; }
    .sb-list { overflow-y: auto; padding: 4px 6px; flex: 1; }

    /* 折りたたみ可能なセクション（スタッフ欄） */
    .collapse-ico { display: inline-block; transition: transform .15s; font-size: 9px; margin-right: 3px; color: var(--muted); }
    .sb-section.collapsed { flex: 0 0 auto !important; min-height: 0 !important; max-height: none !important; }
    .sb-section.collapsed .sb-list { display: none; }
    .sb-section.collapsed .sb-total { display: none !important; }
    .sb-section.collapsed .collapse-ico { transform: rotate(-90deg); }
    .sb-head.toggle { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .sb-head.toggle:hover { background: var(--bg); }

    /* Job items */
    .job-item {
      display: flex; align-items: center; gap: 6px; padding: 8px 10px;
      border-radius: var(--radius); border: 1px solid transparent; transition: background .1s;
      position: relative; cursor: pointer;
    }
    .job-item:hover { background: var(--bg); border-color: var(--border); }
    .job-progress { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .job-progress.all-done { color: #16a34a; font-weight: 600; }
    .job-item:hover .item-del { opacity: 1; }

    /* 工程パイプライン（案件ごとの進捗） */
    .job-pipeline { display: flex; align-items: center; gap: 2px; margin-top: 5px; flex-wrap: wrap; }
    .pstage {
      font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 4px;
      font-weight: 700; border: 1px solid var(--border); color: var(--muted); background: var(--bg);
    }
    .pstage.sched { border-color: #93c5fd; color: var(--primary); background: #eff6ff; }
    .pstage.wip   { border-color: #fbbf24; color: #b45309; background: #fffbeb; }
    .pstage.done  { border-color: #10b981; color: #fff; background: #10b981; }
    .parrow { font-size: 9px; color: #cbd5e1; }

    /* 工程チップ（タップ選択） */
    .stage-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
    .stage-chip {
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 9px;
      background: var(--surface); font-size: 14px; font-weight: 600; color: var(--text);
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: transform .05s;
    }
    .stage-chip.sel { background: var(--primary); border-color: var(--primary); color: #fff; }
    .stage-chip:active { transform: scale(0.94); }
    .btn-nextstage { background: #10b981; color: #fff; }
    .btn-nextstage:hover:not(:disabled) { background: #059669; }
    .job-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .item-name { flex: 1; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { font-size: 12px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .item-del {
      opacity: 0; transition: opacity .15s; background: transparent; border: none;
      cursor: pointer; color: #ef4444; font-size: 13px; padding: 2px 5px; line-height: 1; flex-shrink: 0;
    }
    .item-del:hover { color: #dc2626; }

    /* Total line */
    .sb-total {
      padding: 8px 16px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
      margin-top: 2px; flex-shrink: 0;
    }
    .sb-total-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .sb-total-val { font-size: 20px; font-weight: 800; color: var(--text); }

    /* Deadline badge */
    .job-dl { font-size: 11px; white-space: nowrap; flex-shrink: 0; padding: 2px 6px; border-radius: 3px; }
    .job-dl.ok     { color: var(--muted); }
    .job-dl.soon   { color: #d97706; background: #fef3c7; font-weight: 600; }
    .job-dl.urgent { color: #dc2626; background: #fee2e2; font-weight: 700; }
    .job-dl.over   { color: #fff; background: #dc2626; font-weight: 700; }

    /* Staff items */
    .staff-item {
      display: flex; align-items: center; gap: 6px; padding: 8px 10px;
      border-radius: var(--radius); border: 1px solid transparent; transition: background .1s;
      cursor: pointer;
    }
    .staff-item:hover { background: var(--bg); border-color: var(--border); }
    .staff-item:hover .item-del { opacity: 1; }
    .staff-icon { font-size: 14px; flex-shrink: 0; }

    .sb-empty { padding: 20px 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; }

    /* ─── Matrix ─── */
    .matrix-wrap { flex: 1; overflow: auto; padding-bottom: var(--sab); -webkit-overflow-scrolling: touch; }

    /* ズームコントロール（カレンダー縮小・拡大） */
    .zoom-ctrl {
      position: fixed; right: calc(12px + var(--sar)); bottom: calc(14px + var(--sab)); z-index: 55;
      display: flex; align-items: center; gap: 1px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
    }
    .zoom-ctrl button {
      border: none; background: var(--surface); color: var(--text); font-family: inherit;
      font-size: 19px; font-weight: 700; padding: 8px 14px; cursor: pointer; line-height: 1;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .zoom-ctrl button:active { background: var(--bg); }
    .zoom-ctrl .zoom-pct { font-size: 13px; min-width: 52px; padding: 8px 6px; color: var(--muted); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    body.select-mode .zoom-ctrl { display: none; }
    @media print { .zoom-ctrl { display: none; } }
    .matrix { border-collapse: separate; border-spacing: 0; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
    .matrix th, .matrix td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .matrix thead th { position: sticky; top: 0; background: var(--surface); z-index: 10; }
    .col-stage { position: sticky; left: 0; z-index: 8; background: var(--surface); }
    .matrix thead .col-stage { z-index: 20; }
    .corner-cell { width: 120px; min-width: 120px; background: #f8fafc; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding: 12px 8px; }
    .date-th { width: 160px; min-width: 160px; text-align: center; padding: 9px 6px; font-size: 13px; background: var(--surface); white-space: nowrap; vertical-align: middle; }
    .date-th.today { background: var(--today-bg); color: var(--primary); font-weight: 700; }
    .date-th.weekend { background: var(--weekend-bg); }
    .date-th.sun { color: #dc2626; }
    .date-th.sat { color: var(--primary); }
    .d-num { font-size: 22px; font-weight: 700; display: block; line-height: 1.2; }
    .d-dow { font-size: 13px; }
    .d-flag { display: block; font-size: 12px; line-height: 1; margin-top: 3px; }
    .staff-th { width: 120px; min-width: 120px; background: #f8fafc; padding: 0; }
    .staff-inner { padding: 12px 8px 4px; font-size: 15px; font-weight: 700; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .staff-shift { display: flex; gap: 3px; justify-content: center; padding: 0 4px 8px; }
    .staff-shift button { flex: 1; min-width: 0; font-size: 10px; font-weight: 700; padding: 3px 0; border: 1px solid var(--border); background: #fff; color: var(--muted); border-radius: 5px; cursor: pointer; }
    .staff-shift button:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
    .mcell { vertical-align: top; padding: 5px; background: #fff; min-width: 160px; transition: background .1s; }
    .mcell.today-col { background: #fafcff; }
    .mcell.weekend-col { background: #fffef5; }
    .mcell.over { background: #dbeafe !important; outline: 2px dashed #60a5fa; outline-offset: -2px; }
    .cell-inner { min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
    .cell-add { display: none; width: 100%; border: 1px dashed var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 6px; border-radius: 5px; text-align: center; transition: all .1s; font-family: inherit; touch-action: manipulation; }
    .cell-add:hover { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
    .mcell:hover .cell-add { display: block; }
    /* Touch devices: always show + button */
    @media (hover: none), (pointer: coarse) { .cell-add { display: block; } }

    /* ─── Card ─── */
    .card {
      border-radius: 8px; padding: 9px 12px;
      display: flex; flex-direction: column; gap: 5px;
      color: #fff; cursor: grab; user-select: none;
      font-size: 15px; font-weight: 600;
      box-shadow: 0 2px 5px rgba(0,0,0,.25);
      transition: transform .1s, box-shadow .1s, opacity .1s;
      touch-action: none; /* prevent browser scroll interference during drag */
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: .35; transform: scale(.94); }
    .card.done { opacity: 0.42; }
    .card.done .card-label { text-decoration: line-through; }
    .card-top { display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; }
    .card-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; font-size: 16px; }
    .card-bottom { display: flex; align-items: center; gap: 5px; }
    .card-qty { background: rgba(0,0,0,.25); border-radius: 4px; padding: 3px 8px; font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .card-stage-badge {
      background: rgba(255,255,255,.22); border-radius: 4px;
      padding: 3px 8px; font-size: 13px; font-weight: 600;
      flex-shrink: 0; white-space: nowrap;
    }
    .card-check {
      background: rgba(0,0,0,.2); border: none; border-radius: 4px;
      color: rgba(255,255,255,.8); cursor: pointer;
      font-size: 15px; padding: 4px 10px; flex-shrink: 0;
      line-height: 1.3; transition: background .1s, transform .08s; font-family: inherit; font-weight: 700;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .card-check:active { transform: scale(0.88); background: rgba(255,255,255,.5); }
    .card-check:hover { background: rgba(255,255,255,.35); color: white; }
    .card.done .card-check { background: rgba(255,255,255,.45); color: white; }

    /* 完了バッチのコンパクト表示（同じ案件をまとめる） */
    .done-group {
      display: flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 6px;
      background: rgba(100,116,139,.12); cursor: pointer; font-size: 12px; color: var(--muted);
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .done-group:active { transform: scale(.97); }
    .done-group:hover { background: rgba(100,116,139,.2); }
    .dg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dg-check { color: #16a34a; font-weight: 800; flex-shrink: 0; }
    .dg-name {
      text-decoration: line-through; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0; font-weight: 600; color: #475569;
    }
    .dg-stage { background: rgba(100,116,139,.2); border-radius: 3px; padding: 1px 5px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .dg-qty { flex-shrink: 0; font-weight: 700; }
    .dg-expand { font-size: 10px; color: #94a3b8; flex-shrink: 0; }
    .done-collapse {
      display: flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 11px;
      color: var(--primary); cursor: pointer; font-weight: 600;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }

    /* カード内「次の工程へ」ワンタップボタン */
    .card-next {
      background: rgba(255,255,255,.28); border: none; border-radius: 4px;
      color: #fff; cursor: pointer; font-size: 12px; padding: 4px 9px; flex-shrink: 0;
      line-height: 1.2; font-family: inherit; font-weight: 800;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .card-next:active { transform: scale(0.88); background: rgba(255,255,255,.5); }
    .card-next:hover { background: rgba(255,255,255,.42); }

    /* 選択モード：選択可能カード */
    .sel-card { cursor: pointer; touch-action: manipulation; outline: 2px solid transparent; outline-offset: 1px; }
    .sel-card.selected { outline-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.35); }
    .sel-check { font-size: 16px; flex-shrink: 0; line-height: 1; }
    body.select-mode .cell-add { display: none !important; }

    /* 一括操作バー */
    .bulk-bar {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: #1e293b; color: #fff; padding: 10px 14px; padding-bottom: calc(10px + var(--sab));
      align-items: center; gap: 10px; flex-wrap: wrap;
      box-shadow: 0 -4px 16px rgba(0,0,0,.25);
    }
    body.select-mode .bulk-bar { display: flex; }
    .bulk-count { font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .bulk-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .bulk-bar .btn-sm { padding: 7px 11px; font-size: 13px; }
    .bulk-bar .btn:disabled { opacity: .4; cursor: not-allowed; }
    #selectModeBtn.on { background: var(--primary); color: #fff; }

    /* 工程チップ（一括工程変更） */
    .stage-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .stage-chip {
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 9px;
      background: var(--surface); font-size: 14px; font-weight: 700; color: var(--text);
      cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .stage-chip:active { transform: scale(.95); }
    .stage-chip:hover { border-color: var(--primary); color: var(--primary); }

    /* ─── Overlays ─── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,.45); z-index: 500;
      align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .overlay.open { display: flex; animation: ovFadeIn .18s ease; }
    @keyframes ovFadeIn { from { opacity:0; } to { opacity:1; } }
    .modal {
      background: #fff; border-radius: 14px; padding: 26px;
      width: 440px; max-width: calc(100vw - 24px);
      box-shadow: 0 24px 64px rgba(0,0,0,.3);
      animation: modalUp .2s ease;
      max-height: calc(100vh - 48px - var(--sat) - var(--sab));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    @keyframes modalUp { from { transform: translateY(18px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
    .form-row { margin-bottom: 13px; }
    label.form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; outline: none; transition: border-color .12s; font-family: inherit; }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #dbeafe; }
    select.form-input { cursor: pointer; background: #fff; }
    .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .1s; flex-shrink: 0; }
    .swatch:hover { transform: scale(1.15); }
    .swatch.on { border-color: #fff; box-shadow: 0 0 0 2.5px var(--primary); }
    .modal-foot { display: flex; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .modal-foot .ml { margin-left: auto; }

    /* Detail modal */
    .detail-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .detail-bar { width: 4px; height: 42px; border-radius: 2px; flex-shrink: 0; }
    .detail-name { font-weight: 700; font-size: 15px; }
    .detail-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--bg); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; }
    .meta-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
    .meta-val { font-size: 14px; font-weight: 600; margin-top: 2px; }
    .split-sec { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 2px; }
    .split-head { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 10px; }
    .split-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .split-lbl { font-size: 12px; font-weight: 600; min-width: 54px; }
    .split-b { font-size: 12px; color: var(--muted); min-width: 44px; }
    .split-err { font-size: 11px; color: #ef4444; min-height: 16px; margin-top: 4px; }

    /* ─── Toast ─── */
    .toast { position: fixed; bottom: 28px; right: 28px; background: #1e293b; color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; z-index: 9999; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: var(--shadow); }

    /* 元に戻す（Undo）バー */
    .undo-bar {
      position: fixed; left: 50%; bottom: calc(24px + var(--sab)); transform: translateX(-50%) translateY(12px);
      background: #1e293b; color: #fff; padding: 9px 10px 9px 16px; border-radius: 11px; font-size: 14px;
      z-index: 9998; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    .undo-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .undo-btn { background: #3b82f6; color: #fff; border: none; border-radius: 7px; padding: 6px 13px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; touch-action: manipulation; }
    .undo-btn:active { transform: scale(.95); }
    .undo-close { background: transparent; border: none; color: #94a3b8; font-size: 15px; cursor: pointer; padding: 2px 5px; touch-action: manipulation; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ─── View toggle ─── */
    .view-toggle { display: flex; gap: 2px; background: var(--bg); border-radius: var(--radius); padding: 2px; border: 1px solid var(--border); }
    .view-btn {
      padding: 6px 13px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px;
      background: transparent; color: var(--muted); font-family: inherit; font-weight: 500;
      white-space: nowrap; touch-action: manipulation;
      transition: background .1s, transform .08s;
      -webkit-tap-highlight-color: transparent;
    }
    .view-btn:active { transform: scale(0.94); }
    .view-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 700; }

    /* ─── Status badge ─── */
    .status-badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
    .s-未着手   { background: #f1f5f9; color: #64748b; }
    .s-製作中   { background: #dbeafe; color: #2563eb; }
    .s-完成     { background: #dcfce7; color: #16a34a; }
    .s-発送済み { background: #e2e8f0; color: #475569; }

    /* ─── Unscheduled warning ─── */
    .unscheduled-warn { font-size: 11px; color: #ef4444; font-weight: 600; }

    /* ─── Carryover ─── */
    .sb-carryover { background: #fffbeb; }
    .carryover-item { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-top: 1px solid #fde68a; }
    .carryover-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .carryover-info { flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .carryover-date { font-size: 11px; color: #b45309; flex-shrink: 0; }

    /* ─── Today panel ─── */
    .today-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .today-item:last-child { border-bottom: none; }
    .today-item.done-item { opacity: 0.45; }
    .today-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .today-info { flex: 1; min-width: 0; }
    .today-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .today-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .today-qty { font-size: 15px; font-weight: 700; flex-shrink: 0; }
    .today-check { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); cursor: pointer; font-size: 15px; padding: 5px 12px; font-family: inherit; font-weight: 700; transition: background .1s; }
    .today-check:hover { background: #dcfce7; border-color: #86efac; }
    .today-empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 15px; }

    /* 今週やること（木〜水） */
    .wk-day { border-bottom: 1px solid var(--border); padding: 10px 20px 12px; }
    .wk-day:last-child { border-bottom: none; }
    .wk-day.wk-today { background: #eff6ff; }
    .wk-day-head { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .wk-todaytag { font-size: 10px; background: var(--primary); color: #fff; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
    .wk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .wk-item { display: flex; align-items: center; gap: 8px; }
    .wk-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .wk-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
    .wk-qty { color: var(--muted); font-size: 12px; }
    .wk-check {
      flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
      width: 30px; height: 30px; font-size: 15px; cursor: pointer; color: var(--muted);
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .wk-check:active { transform: scale(.9); background: var(--bg); }

    /* ─── Touch DnD ghost ─── */
    .touch-ghost {
      position: fixed; z-index: 9999; pointer-events: none;
      opacity: .88; border-radius: 8px;
      transform: scale(1.06) rotate(2deg);
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
      transition: none;
    }

    /* ─── Archive ─── */
    .archived-toggle { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 6px; text-decoration: underline; font-family: inherit; }
    .job-item.archived-item { opacity: 0.5; }
    .job-item.archived-item .item-name { text-decoration: line-through; }

    /* ─── Summary ─── */
    .sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .sum-stat { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; text-align: center; }
    .sum-stat-val { font-size: 22px; font-weight: 800; color: var(--text); }
    .sum-stat-label { font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .sum-section { margin-bottom: 18px; }
    .sum-section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .fc-card { flex: 1; min-width: 130px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .fc-label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .fc-val { font-size: 18px; font-weight: 800; margin-top: 2px; }
    .sum-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sum-table th { text-align: left; padding: 6px 8px; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--bg); }
    .sum-table td { padding: 8px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
    .sum-bar-wrap { background: #e2e8f0; border-radius: 3px; height: 7px; width: 80px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
    .sum-bar-fill { height: 100%; border-radius: 3px; background: var(--primary); transition: width .3s; }
    .sum-bar-fill.done-full { background: #22c55e; }

    /* ─── 資材管理 ─── */
    .mat-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; background: #fff; }
    .mat-row.low { border-color: #fca5a5; background: #fff7f7; }
    .mat-main { flex: 1; min-width: 0; }
    .mat-name { font-weight: 700; font-size: 14px; }
    .mat-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .mat-nums { display: flex; gap: 10px; white-space: nowrap; text-align: center; }
    .mat-num-val { font-weight: 800; font-size: 15px; display: block; }
    .mat-num-lbl { font-size: 10px; color: var(--muted); font-weight: 600; }
    .mat-acts { display: flex; gap: 4px; flex-shrink: 0; }
    .mat-badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: #fee2e2; color: #b91c1c; margin-left: 5px; }
    .mat-badge.ok { background: #dcfce7; color: #15803d; }
    .mat-badge.warn { background: #ffedd5; color: #c2410c; }
    .bom-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .bom-empty { font-size: 12px; color: var(--muted); padding: 6px 0; }
    .bom-cost { font-size: 12px; font-weight: 700; color: var(--primary); margin-top: 4px; }
    .mat-log { font-size: 12px; display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); }
    @media (max-width: 520px) {
      .mat-row { flex-wrap: wrap; }
      .mat-main { flex-basis: 100%; }
    }

    /* ─── Print ─── */
    @media print {
      .header-right, .btn, .sidebar, .item-del, .card-check, .cell-add,
      .view-toggle, .month-nav .btn-ghost { display: none !important; }
      .header { box-shadow: none; padding: 6px 16px; }
      .layout { height: auto; overflow: visible; }
      .matrix-wrap { overflow: visible; }
      html, body { overflow: visible !important; height: auto !important; }
      .card { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .mcell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      /* レポート印刷モード：サマリー(レポート)だけを紙面に出す */
      body.print-report .header, body.print-report .layout,
      body.print-report .zoom-ctrl, body.print-report .bulk-bar { display: none !important; }
      body.print-report #ovSummary { position: static !important; display: block !important; background: none !important; padding: 0 !important; }
      body.print-report #ovSummary .modal { box-shadow: none !important; max-height: none !important; width: 100% !important; padding: 0 !important; }
      body.print-report #ovSummary #sumBody { overflow: visible !important; max-height: none !important; }
      body.print-report #ovSummary .modal-foot { display: none !important; }
      body.print-report .sum-section { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body.print-report .fc-card { break-inside: avoid; }
    }
  </style>
</head>
<body>

<!-- ─── Header ─── -->
<header class="header">
  <button class="btn-sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="サイドバー">☰</button>
  <span class="header-title">生産管理表</span>
  <div class="header-sep"></div>
  <div class="month-nav">
    <button class="btn btn-secondary btn-icon" onclick="shiftMonth(-1)">◀</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="btn btn-secondary btn-icon" onclick="shiftMonth(1)">▶</button>
    <button class="btn btn-ghost btn-sm" onclick="goToday()">今日</button>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="vBtn-month" onclick="setViewMode('month')">月</button>
    <button class="view-btn" id="vBtn-2week" onclick="setViewMode('2week')">2週</button>
    <button class="view-btn" id="vBtn-week" onclick="setViewMode('week')">週</button>
  </div>
  <div class="header-right">
    <button class="btn btn-secondary btn-icon" id="selectModeBtn" onclick="toggleSelectMode()" title="まとめて選択">☑</button>
    <button class="btn btn-secondary btn-icon" onclick="openWeekPanel()" title="今週やること（木〜水）">🗓</button>
    <button class="btn btn-secondary btn-icon" onclick="openTodayPanel()" title="今日のタスク">📋</button>
    <button class="btn btn-secondary btn-icon" id="matBtn" onclick="openMaterials()" title="資材管理・在庫">📦</button>
    <button class="btn btn-secondary btn-icon" onclick="openSummary()" title="月間サマリー">📊</button>
    <button class="btn btn-secondary btn-icon" onclick="window.print()" title="印刷">🖨</button>
    <button class="btn btn-primary" onclick="openAddJob()">＋ 案件追加</button>
  </div>
</header>

<div class="layout">
  <!-- ─── Sidebar ─── -->
  <aside class="sidebar">
    <!-- 案件 -->
    <div class="sb-section" id="jobsSection" style="flex:3;min-height:120px">
      <div class="sb-head toggle" onclick="toggleJobsPanel()">
        <span class="sb-head-title"><span class="collapse-ico">▼</span>案件一覧<span class="sb-count" id="jobCount"></span></span>
        <button class="archived-toggle" id="archiveToggleBtn" onclick="event.stopPropagation();toggleShowArchived()" style="display:none">アーカイブ表示</button>
      </div>
      <div class="sb-list" id="jobList"></div>
      <div class="sb-total" id="jobTotal" style="display:none">
        <span class="sb-total-label">合計</span>
        <span class="sb-total-val" id="jobTotalVal">—</span>
      </div>
    </div>
    <!-- 繰越 -->
    <div class="sb-section sb-carryover" id="carryoverSection" style="display:none;flex-shrink:0">
      <div class="sb-head" style="padding:8px 14px">
        <span class="sb-head-title" style="color:#b45309">⚠ 未完了の繰越<span class="sb-count" id="carryoverCount"></span></span>
        <button class="btn btn-secondary btn-sm" style="padding:2px 8px" onclick="openCarryover(false)">繰越</button>
      </div>
      <div id="carryoverList"></div>
    </div>
    <!-- スタッフ -->
    <div class="sb-section" id="staffSection" style="flex:1;min-height:64px;max-height:180px">
      <div class="sb-head toggle" onclick="toggleStaffPanel()">
        <span class="sb-head-title"><span class="collapse-ico">▼</span>スタッフ<span class="sb-count" id="staffCount"></span></span>
        <button class="btn btn-ghost btn-sm" style="padding:2px 7px;font-size:16px" onclick="event.stopPropagation();openAddStaff()">+</button>
      </div>
      <div class="sb-list" id="staffList"></div>
    </div>
  </aside>

  <!-- ─── Matrix ─── -->
  <div class="matrix-wrap" id="matrixWrap">
    <table class="matrix" id="matrix"></table>
  </div>
</div>

<!-- ─── ズームコントロール ─── -->
<div class="zoom-ctrl" id="zoomCtrl">
  <button onclick="zoomStep(-0.1)" title="縮小">−</button>
  <button class="zoom-pct" id="zoomPct" onclick="resetMatrixZoom()" title="等倍に戻す">100%</button>
  <button onclick="zoomStep(0.1)" title="拡大">＋</button>
</div>

<!-- ─── Add/Edit Job Modal ─── -->
<div class="overlay" id="ovJob" onclick="ovClick(event,'ovJob')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="jobModalTitle">案件を追加</div>
    <div class="form-row">
      <label class="form-label">案件名</label>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <select id="fJobNameSel" class="form-input" style="flex:1;min-width:0" onchange="onJobNameSelChange()"></select>
        <button type="button" class="btn btn-secondary" style="flex-shrink:0;padding:9px 11px" title="選んだ案件名を選択肢から削除" onclick="deleteJobName()">🗑</button>
        <button type="button" class="btn btn-secondary" style="flex-shrink:0;white-space:nowrap;padding:9px 12px" onclick="registerJobName()">＋登録</button>
      </div>
      <input id="fJobName" type="text" class="form-input" placeholder="案件名を入力（手入力もOK）" />
    </div>
    <div class="form-row">
      <label class="form-label">総数量（個）</label>
      <input id="fJobQty" type="number" class="form-input" min="1" value="1" />
    </div>
    <div class="form-row">
      <label class="form-label">単価（円・任意）</label>
      <input id="fJobPrice" type="number" class="form-input" min="0" step="1" placeholder="例：18000" />
    </div>
    <div class="form-row">
      <label class="form-label">使用資材（製品1個あたり）</label>
      <div id="bomRows"></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary btn-sm" onclick="addBomRow()">＋ 資材</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="openMaterials()">📦 資材を登録／編集</button>
      </div>
      <div class="bom-cost" id="bomCost"></div>
    </div>
    <div class="form-row">
      <label class="form-label">カラー</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="form-row">
      <label class="form-label">納期（任意）</label>
      <input id="fJobDeadline" type="date" class="form-input" />
    </div>
    <div class="form-row">
      <label class="form-label">ステータス</label>
      <select id="fJobStatus" class="form-input">
        <option value="未着手">未着手</option>
        <option value="製作中">製作中</option>
        <option value="完成">完成</option>
        <option value="発送済み">発送済み</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">メモ（任意）</label>
      <textarea id="fJobMemo" class="form-input" rows="2" style="resize:vertical;min-height:58px" placeholder="特記事項・仕様など"></textarea>
    </div>
    <div class="form-row" id="jobShiftRow" style="display:none">
      <label class="form-label">残りの予定をまとめてずらす</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" onclick="shiftJobRemaining(-7)">−1週</button>
        <button type="button" class="btn btn-secondary" onclick="shiftJobRemaining(-1)">−1日</button>
        <button type="button" class="btn btn-secondary" onclick="shiftJobRemaining(1)">＋1日</button>
        <button type="button" class="btn btn-secondary" onclick="shiftJobRemaining(7)">＋1週</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="jobDeleteBtn" style="display:none" onclick="doDeleteJobFromModal()">削除</button>
      <button class="btn btn-secondary" id="jobArchiveBtn" style="display:none" onclick="toggleArchiveJob()">アーカイブ</button>
      <button class="btn btn-secondary" id="jobDupBtn" style="display:none" onclick="duplicateJob()">複製</button>
      <button class="btn btn-secondary" onclick="closeOv('ovJob')">キャンセル</button>
      <button class="btn btn-primary ml" id="jobSubmitBtn" onclick="submitJob()">追加する</button>
    </div>
  </div>
</div>

<!-- ─── Add/Edit Staff Modal ─── -->
<div class="overlay" id="ovStaff" onclick="ovClick(event,'ovStaff')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="staffModalTitle">スタッフを追加</div>
    <div class="form-row">
      <label class="form-label">名前</label>
      <input id="fStaffName" type="text" class="form-input" placeholder="例：田中" />
    </div>
    <div class="form-row" id="staffShiftRow" style="display:none">
      <label class="form-label" id="staffShiftLabel">未完了の予定をまとめてずらす</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" onclick="shiftStaffFromModal(-7)">−1週</button>
        <button type="button" class="btn btn-secondary" onclick="shiftStaffFromModal(-1)">−1日</button>
        <button type="button" class="btn btn-secondary" onclick="shiftStaffFromModal(1)">＋1日</button>
        <button type="button" class="btn btn-secondary" onclick="shiftStaffFromModal(7)">＋1週</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="staffDeleteBtn" style="display:none" onclick="doDeleteStaffFromModal()">削除</button>
      <button class="btn btn-secondary" onclick="closeOv('ovStaff')">キャンセル</button>
      <button class="btn btn-primary ml" id="staffSubmitBtn" onclick="submitStaff()">追加する</button>
    </div>
  </div>
</div>

<!-- ─── Add Batch Modal ─── -->
<div class="overlay" id="ovBatch" onclick="ovClick(event,'ovBatch')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="batchHead">バッチを追加</div>
    <div class="form-row">
      <label class="form-label">案件</label>
      <select id="fBatchJob" class="form-input"></select>
    </div>
    <div class="form-row">
      <label class="form-label">工程</label>

<script>
'use strict';

// ─── Constants ───────────────────────────────────────────────────────────────
const STAGES = ['裁断','刻印','漉き','段取り','縫製','紐通し','仕上げ','その他'];
// 直線的な製作工程（パイプライン進捗・次工程ボタン用）。その他は補助工程なので含めない
const PIPELINE = ['裁断','刻印','漉き','段取り','縫製','紐通し','仕上げ'];
// パイプライン表示用の短縮ラベル
const STAGE_SHORT = { '裁断':'裁','刻印':'刻','漉き':'漉','段取り':'段','縫製':'縫','紐通し':'紐','仕上げ':'仕' };
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#64748b'];
const DOW = ['日','月','火','水','木','金','土'];
const STORE_KEY = 'seisan_v2';
const STORE_V1   = 'seisan_v1';

// ─── State ───────────────────────────────────────────────────────────────────
const JOB_STATUS = ['未着手','製作中','完成','発送済み'];
const STATUS_CLS  = { '未着手':'s-未着手','製作中':'s-製作中','完成':'s-完成','発送済み':'s-発送済み' };

let DB = { jobs: [], staff: [], batches: [] };
let view = { y: 0, m: 0, mode: 'month', weekStart: '' };
let pickedColor = COLORS[0];
let batchCtx = { staffId: '', date: '' };
let activeId = null;
let dragId = null;
let justDragged = false;
let editJobId = null;
let editStaffId = null;
let showArchived = false;
let staffCollapsed = false;
let jobsCollapsed = false;
let touchDrag = { id: null, clone: null, target: null, origCard: null, startX: 0, startY: 0, moved: false };
const ROW_COLORS = ['#eff6ff','#f0fdf4','#fefce8','#fdf4ff','#fff7ed','#f0fdfa','#fef2f2','#f8fafc'];
const expandedDone = new Set(); // 展開中の完了グループ（staffId|date|jobId）。表示専用・保存しない
let selectMode = false;          // 一括選択モード
const selectedBatches = new Set(); // 選択中のバッチID

// ─── Boot ────────────────────────────────────────────────────────────────────
(function boot() {
  const now = new Date();
  view.y = now.getFullYear();
  view.m = now.getMonth() + 1;

  // Try v2 first, then migrate from v1
  try {
    const rawV2 = localStorage.getItem(STORE_KEY);
    if (rawV2) {
      try { DB = JSON.parse(rawV2); } catch (_) {}
    } else {
      const rawV1 = localStorage.getItem(STORE_V1);
      if (rawV1) {
        try {
          const v1 = JSON.parse(rawV1);
          const defaultStaff = { id: uid(), name: 'メイン' };
          DB.jobs = v1.jobs || [];
          DB.staff = [defaultStaff];
          DB.batches = (v1.batches || []).map(b => ({
            id: b.id, jobId: b.jobId, qty: b.qty,
            staffId: defaultStaff.id,
            stage: b.stage || 'その他',
            date: b.date, done: b.done || false
          }));
          save();
          toast('データを新バージョンに変換しました');
        } catch (_) {}
      }
    }
  } catch (_) {}

  // データ構造の正規化
  if (!Array.isArray(DB.jobs)) DB.jobs = [];
  if (!Array.isArray(DB.staff)) DB.staff = [];
  if (!Array.isArray(DB.batches)) DB.batches = [];
  // 案件名プリセット（案件追加の選択肢）。旧テンプレ名があれば引き継ぐ
  if (!Array.isArray(DB.jobNames)) {
    DB.jobNames = Array.isArray(DB.templates) ? DB.templates.map(t => t && t.name).filter(Boolean) : [];
  }
  delete DB.templates;
  // 資材マスタ
  if (!Array.isArray(DB.materials)) DB.materials = [];
  for (const m of DB.materials) {
    if (typeof m.inQty !== 'number') m.inQty = 0;
    if (!Array.isArray(m.logs)) m.logs = [];
    if (!m.unit) m.unit = '個';
  }
  // 案件の使用資材（BOM）
  for (const j of DB.jobs) {
    if (!Array.isArray(j.bom)) j.bom = [];
  }
  // 月次繰越
  if (typeof DB.lastMonth !== 'string') DB.lastMonth = '';
  if (typeof DB.autoCarry !== 'boolean') DB.autoCarry = false;

  try { document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllOv(); }); } catch(_) {}
  try { document.addEventListener('touchmove', onTouchMove, { passive: false }); } catch(_) {}
  try { document.addEventListener('touchend', onTouchEnd); } catch(_) {}
  try {
    const mw = document.getElementById('matrixWrap');
    mw.addEventListener('touchstart', onWrapTouchStart, { passive: true });
    mw.addEventListener('touchmove', onWrapTouchMove, { passive: false });
    mw.addEventListener('touchend', onWrapTouchEnd);
    mw.addEventListener('touchcancel', onWrapTouchEnd);
  } catch(_) {}
  try { document.getElementById('fJobName').addEventListener('keydown', e => { if (e.key === 'Enter') submitJob(); }); } catch(_) {}
  try { document.getElementById('fBatchQty').addEventListener('keydown', e => { if (e.key === 'Enter') submitBatch(); }); } catch(_) {}
  try { document.getElementById('fStaffName').addEventListener('keydown', e => { if (e.key === 'Enter') submitStaff(); }); } catch(_) {}
  try { document.getElementById('fJobQty').addEventListener('input', renderBomCost); } catch(_) {}
  try { document.getElementById('fJobPrice').addEventListener('input', renderBomCost); } catch(_) {}
  try { document.getElementById('fMatName').addEventListener('keydown', e => { if (e.key === 'Enter') submitMat(); }); } catch(_) {}
  try { document.getElementById('fMatInQty').addEventListener('keydown', e => { if (e.key === 'Enter') submitMatIn(); }); } catch(_) {}

  try { staffCollapsed = localStorage.getItem('seisan_staffCollapsed') === '1'; } catch(_) {}
  try { jobsCollapsed = localStorage.getItem('seisan_jobsCollapsed') === '1'; } catch(_) {}
  try { render(); } catch(e) { console.error('render error:', e); }
  try { applyStaffCollapse(); } catch(_) {}
  try { applyJobsCollapse(); } catch(_) {}
  try { const z = parseFloat(localStorage.getItem('seisan_matrixZoom')); if (z) setMatrixZoom(z); } catch(_) {}
  try { scrollToToday(); } catch(_) {}
  try { checkInstallBanner(); } catch(_) {}
  try { checkMonthRollover(); } catch(e) { console.error('rollover error:', e); }
})();

// ─── Persistence ─────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch(_) {}
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function daysIn(y, m) { return new Date(y, m, 0).getDate(); }
function ds(y, m, d) { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function todayDs() { const n = new Date(); return ds(n.getFullYear(), n.getMonth()+1, n.getDate()); }
function dow(y, m, d) { return new Date(y, m-1, d).getDay(); }
function jobById(id) { return DB.jobs.find(j => j.id === id); }
function staffById(id) { return DB.staff.find(s => s.id === id); }
function batchById(id) { return DB.batches.find(b => b.id === id); }
// 案件にすでに割り当て済みの数量（全バッチ合計）
function jobScheduledQty(jobId) {
  return DB.batches.filter(b => b.jobId === jobId).reduce((s, b) => s + b.qty, 0);
}
// 案件の残り（未割当）数量
function jobRemainingQty(job) {
  return (job.totalQty || 0) - jobScheduledQty(job.id);
}
// 案件の工程別進捗（工程ごとの 配置数 / 完了数）
function jobStageProgress(jobId) {
  const map = {};
  STAGES.forEach(st => { map[st] = { sched: 0, done: 0 }; });
  DB.batches.filter(b => b.jobId === jobId).forEach(b => {
    const st = b.stage || 'その他';
    if (!map[st]) map[st] = { sched: 0, done: 0 };
    map[st].sched += b.qty;
    if (b.done) map[st].done += b.qty;
  });
  return map;
}
// 案件の完成数（個数）。ステータスが「完成」「発送済み」なら、
// 外注などでマトリクスに工程を置いていなくても総数を完成として扱う。
// それ以外は最終工程（仕上げ）の完了数で数える（総数を上限）。
function jobFinishedQty(j) {
  const total = j.totalQty || 0;
  const status = j.status || '未着手';
  if (status === '完成' || status === '発送済み') return total;
  const prog = jobStageProgress(j.id);
  const lastStage = PIPELINE[PIPELINE.length - 1];
  return Math.min((prog[lastStage] || {}).done || 0, total);
}
// 案件が完成しているか（全工程の作業が終わっているか）
function jobIsComplete(j) {
  return (j.totalQty || 0) > 0 && jobFinishedQty(j) >= (j.totalQty || 0);
}
// いまカレンダー上に作業中（未完了）のカードがあるか
function jobHasActiveBatch(j) {
  return DB.batches.some(b => b.jobId === j.id && !b.done);
}
// 案件の完成日（売上計上月の判定用）。完成していなければ null。
// 最終工程(仕上げ)の完了日を優先、なければ最後の完了日、無ければ納期。
function jobCompletionDate(j) {
  if (!jobIsComplete(j)) return null;
  const done = DB.batches.filter(b => b.jobId === j.id && b.done && b.date);
  if (done.length) {
    const last = PIPELINE[PIPELINE.length - 1];
    const finishing = done.filter(b => b.stage === last);
    const pool = (finishing.length ? finishing : done).map(b => b.date).sort();
    return pool[pool.length - 1];
  }
  return j.deadline || null;
}
// 案件にかかった作業時間（分）合計
function jobMinutes(j) {
  return DB.batches.filter(b => b.jobId === j.id).reduce((s, b) => s + (b.minutes || 0), 0);
}

// ─── 資材（在庫・所要量・原価） ───────────────────────────────────────────────
const MAT_UNITS = ['枚','m','cm','個','本','組','セット','g','ml','パック'];
function matById(id) { return (DB.materials || []).find(m => m.id === id); }
// 案件の有効な BOM 行（1個あたりの使用量）
function jobBom(j) {
  return Array.isArray(j.bom) ? j.bom.filter(x => x && x.matId && x.per > 0 && matById(x.matId)) : [];
}
// 製品1個あたりの材料費
function jobMatUnitCost(j) {
  return jobBom(j).reduce((s, x) => { const m = matById(x.matId); return s + ((m && m.price) ? m.price * x.per : 0); }, 0);
}
// 案件全体の材料費（総数量ぶん）
function jobMatCost(j) { return jobMatUnitCost(j) * (j.totalQty || 0); }
// 案件の粗利（売上 − 材料費）。単価未設定なら null
function jobProfit(j) {
  if (j.unitPrice == null || !(j.unitPrice > 0)) return null;
  return (j.unitPrice - jobMatUnitCost(j)) * (j.totalQty || 0);
}
// 数値を見やすく（小数は最大2桁）
function numShort(n) {
  if (!isFinite(n)) return '0';
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : String(r);
}
// 資材ごとの在庫状況を一括計算
//   inQty    … 入庫累計（初期在庫＋入庫記録）
//   used     … 完成した個数ぶんの消費（自動）
//   reserved … 未完成の残数ぶんの引当（予定消費）
//   stock    … 現在庫 = inQty − used
//   free     … 引当を差し引いた余裕 = stock − reserved
//   short    … 不足数（free がマイナスのとき）
function materialStats() {
  const st = {};
  for (const m of (DB.materials || [])) st[m.id] = { inQty: m.inQty || 0, used: 0, reserved: 0, jobs: [] };
  for (const j of DB.jobs) {
    if (j.archived) continue;
    const bom = jobBom(j);
    if (!bom.length) continue;
    const fin = jobFinishedQty(j);
    const remain = Math.max((j.totalQty || 0) - fin, 0);
    for (const x of bom) {
      const s = st[x.matId];
      if (!s) continue;
      s.used += x.per * fin;
      s.reserved += x.per * remain;
      if (remain > 0) s.jobs.push({ name: j.name, color: j.color, qty: x.per * remain });
    }
  }
  for (const id in st) {
    const s = st[id];
    s.used = Math.round(s.used * 100) / 100;
    s.reserved = Math.round(s.reserved * 100) / 100;
    s.stock = Math.round((s.inQty - s.used) * 100) / 100;
    s.free = Math.round((s.stock - s.reserved) * 100) / 100;
    s.short = s.free < 0 ? Math.round(-s.free * 100) / 100 : 0;
  }
  return st;
}
// 発注が必要な資材のリスト（不足 or 発注点割れ）
function reorderList() {
  const st = materialStats();
  const out = [];
  for (const m of (DB.materials || [])) {
    const s = st[m.id];
    if (!s) continue;
    const rp = (m.reorder != null && m.reorder > 0) ? m.reorder : 0;
    // 発注点は「引当を差し引いた余裕（過不足）」で判定する
    const belowRp = rp > 0 && s.free <= rp;
    if (s.short > 0 || belowRp) {
      // 発注量＝不足分。発注点があれば発注点も満たすように
      const need = Math.max(s.short, rp > 0 ? Math.max(rp - s.free, 0) : 0);
      out.push({ mat: m, stat: s, need: Math.ceil(need * 100) / 100, cost: (m.price || 0) * Math.ceil(need * 100) / 100, reason: s.short > 0 ? '不足' : '発注点' });
    }
  }
  return out;
}
// 金額をコンパクト表記（例：18万 / 1.2万 / 5000）
function yenShort(n) {
  if (n >= 10000) { const m = n / 10000; return (n % 10000 === 0 ? m.toFixed(0) : m.toFixed(1)) + '万'; }
  return String(n);
}
// シンプルな棒グラフSVG（items: [{label, value, short}]）
function barChartSVG(items, color) {
  const W = 520, H = 168, padB = 24, padT = 20, padL = 6, padR = 6;
  const n = items.length || 1;
  const max = Math.max(1, ...items.map(i => i.value));
  const bw = (W - padL - padR) / n;
  let svg = '';
  items.forEach((it, i) => {
    const bh = it.value > 0 ? Math.max(2, (H - padB - padT) * (it.value / max)) : 0;
    const x = padL + i * bw + bw * 0.16, w = bw * 0.68, y = H - padB - bh;
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${color}"/>`;
    if (it.value > 0 && it.short) svg += `<text x="${(x + w / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" font-size="9" text-anchor="middle" fill="#475569">${it.short}</text>`;
    svg += `<text x="${(x + w / 2).toFixed(1)}" y="${H - padB + 13}" font-size="10" text-anchor="middle" fill="#94a3b8">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">${svg}</svg>`;
}
// 完成案件の売上を「YYYY-MM」ごとに集計（計上月＝完成月）
function salesByMonth() {
  const map = {};
  for (const j of DB.jobs) {
    if (j.archived) continue;
    if (!(j.unitPrice != null && j.unitPrice > 0)) continue;
    const cd = jobCompletionDate(j);
    if (!cd) continue;
    const ym = cd.slice(0, 7);
    if (!map[ym]) map[ym] = { revenue: 0, jobs: 0, qty: 0 };
    map[ym].revenue += j.unitPrice * (j.totalQty || 0);
    map[ym].jobs += 1;
    map[ym].qty += (j.totalQty || 0);
  }
  return map;
}
// バッチ追加時のデフォルト数量：未着手があればその数、無ければ総数（次工程ぶん）
function defaultBatchQty(j) {
  const r = jobRemainingQty(j);
  return r > 0 ? r : (j.totalQty || 1);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function deadlineStatus(dl) {
  if (!dl) return 'ok';
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((new Date(dl) - today) / 86400000);
  if (diff < 0)  return 'over';
  if (diff <= 3) return 'urgent';
  if (diff <= 7) return 'soon';
  return 'ok';
}
function toggleDone(event) {
  event.stopPropagation();
  const b = batchById(event.currentTarget.dataset.id);
  if (!b) return;
  b.done = !b.done;
  save(); setTimeout(render, 0);
}

// ─── View mode ───────────────────────────────────────────────────────────────
function getViewLabel() {
  if (view.mode === 'month') return `${view.y}年 ${view.m}月`;
  const days = getDaysToShow();
  const [y1,m1,d1] = days[0].split('-').map(Number);
  const [,m2,d2] = days[days.length-1].split('-').map(Number);
  if (m1 === m2) return `${y1}年${m1}月 ${d1}〜${d2}日`;
  return `${y1}年 ${m1}/${d1}〜${m2}/${d2}`;
}
function getDaysToShow() {
  if (view.mode === 'month') {
    const n = daysIn(view.y, view.m);
    return Array.from({length: n}, (_, i) => ds(view.y, view.m, i+1));
  }
  const n = view.mode === 'week' ? 7 : 14;
  const start = new Date(view.weekStart + 'T00:00:00');
  return Array.from({length: n}, (_, i) => {
    const d = new Date(start); d.setDate(d.getDate() + i);
    return ds(d.getFullYear(), d.getMonth()+1, d.getDate());
  });
}
function setViewMode(mode) {
  view.mode = mode;
  if (mode !== 'month') {
    const today = new Date();
    const day = today.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(today); mon.setDate(today.getDate() + diff);
    view.weekStart = ds(mon.getFullYear(), mon.getMonth()+1, mon.getDate());
  }
  render();
}

function renderSidebar() {

  const totalEl = document.getElementById('jobTotal');
  const totalValEl = document.getElementById('jobTotalVal');
  // 表示中の月に関係する案件だけを載せる（他の月に配置済みのものは外す）
  const hiddenJobs = DB.jobs.filter(j => !jobBelongsToViewMonth(j));
  const archBtn = document.getElementById('archiveToggleBtn');
  if (archBtn) {
    archBtn.style.display = hiddenJobs.length ? '' : 'none';

  }
  const visibleJobs = DB.jobs.filter(j => showArchived || jobBelongsToViewMonth(j));
  const jobCountEl = document.getElementById('jobCount');
  if (jobCountEl) jobCountEl.textContent = showArchived ? `（すべて ${visibleJobs.length}）` : `（${view.m}月 ${visibleJobs.length}）`;
  if (!visibleJobs.length) {
    jel.innerHTML = `<div class="sb-empty">${view.m}月の案件はありません<br>右上の「＋案件追加」から追加できます</div>`;
    totalEl.style.display = 'none';
  } else {
    jel.innerHTML = visibleJobs.map(j => {
      const dlBadge = (() => {
        if (!j.deadline) return '';
        const st = deadlineStatus(j.deadline);
        const label = j.deadline.slice(5).replace('-', '/');
        const icons = { ok: '', soon: '⚡', urgent: '🔥', over: '⚠' };
        return `<span class="job-dl ${st}">${icons[st]}${label}</span>`;
      })();
      // 工程別の進捗（表示すべてに使う）
      const prog = jobStageProgress(j.id);
      const total = j.totalQty || 0;
      const firstStage = PIPELINE[0];                    // 裁断
      const status = j.status || '未着手';
      const statusComplete = (status === '完成' || status === '発送済み');
      // 完成数（ステータス完成・発送済みなら総数、それ以外は最終工程の完了数）
      const finishedQty = jobFinishedQty(j);
      // 着手済み＝最初の工程（裁断）に配置済みの数。未割当＝まだ裁断に置いていない数
      const startedQty = Math.min((prog[firstStage] || {}).sched || 0, total);
      const unstartedQty = statusComplete ? 0 : Math.max(total - startedQty, 0);
      const anyBatch = statusComplete || DB.batches.some(b => b.jobId === j.id);
      const allDone = total > 0 && finishedQty >= total;
      const statusHtml = `<span class="status-badge ${STATUS_CLS[status]||'s-未着手'}">${status}</span>`;
      const progressHtml = allDone
        ? `<div class="job-progress all-done">✅ 完成</div>`
        : (anyBatch ? `<div class="job-progress">完成 ${finishedQty}/${total}個</div>` : '');
      const unschedHtml = unstartedQty > 0
        ? `<span class="unscheduled-warn">未割当${unstartedQty}個</span>`
        : '';
      // 工程パイプライン（裁→刻→漉→段→縫→紐→仕）
      const pipeHtml = PIPELINE.map(st => {
        const p = prog[st] || { sched: 0, done: 0 };
        let cls = 'todo';
        if (total > 0 && p.done >= total) cls = 'done';
        else if (p.done > 0) cls = 'wip';
        else if (p.sched > 0) cls = 'sched';
        return `<span class="pstage ${cls}" title="${esc(st)} 完了${p.done}/${total}個">${STAGE_SHORT[st]||st}</span>`;
      }).join('<span class="parrow">›</span>');
      return `<div class="job-item${j.archived?' archived-item':''}" onclick="openEditJob('${j.id}')">
        <div class="job-dot" style="background:${j.color}"></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
            <span class="item-name" title="${esc(j.name)}">${esc(j.name)}</span>
            <span style="font-size:11px;color:var(--muted);flex-shrink:0;background:var(--bg);padding:1px 5px;border-radius:3px">${j.totalQty}個</span>
            ${dlBadge}${unschedHtml}
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
            ${statusHtml}${progressHtml}
          </div>
          <div class="job-pipeline">${pipeHtml}</div>
        </div>
        <button class="item-del" data-id="${j.id}" onclick="event.stopPropagation();onDelJob(this)">✕</button>
      </div>`;
    }).join('');
    const total = visibleJobs.reduce((s, j) => s + (j.totalQty || 0), 0);
    totalValEl.textContent = `${total}個`;
    totalEl.style.display = 'flex';
  }

  // Carryover (past undone batches)
  const todayStr = todayDs();
  const carryBatches = DB.batches.filter(b => !b.done && b.date < todayStr);
  const covSec = document.getElementById('carryoverSection');
  const covList = document.getElementById('carryoverList');
  const covCount = document.getElementById('carryoverCount');
  if (carryBatches.length) {
    covSec.style.display = '';
    const prevMonth = carryBatches.filter(b => b.date.slice(0,7) < currentMonthKey()).length;
    if (covCount) covCount.textContent = prevMonth ? `${carryBatches.length}（先月以前 ${prevMonth}）` : `${carryBatches.length}`;
    covList.innerHTML = carryBatches.slice(0,8).map(b => {
      const job = jobById(b.jobId); if (!job) return '';
      const staff = staffById(b.staffId);
      const [,mm,dd] = b.date.split('-').map(Number);
      const old = b.date.slice(0,7) < currentMonthKey();
      return `<div class="carryover-item">
        <div class="carryover-dot" style="background:${job.color}"></div>
        <span class="carryover-info">${esc(job.name)} ${esc(b.stage||'')} ${staff?'/ '+esc(staff.name):''}</span>
        <span class="carryover-date"${old?' style="font-weight:800;color:#b91c1c"':''}>${mm}/${dd} ${b.qty}個</span>
      </div>`;
    }).join('') + (carryBatches.length > 8 ? `<div style="padding:6px 14px;font-size:11px;color:#b45309">他${carryBatches.length-8}件…</div>` : '');
  } else {
    covSec.style.display = 'none';
    if (covCount) covCount.textContent = '';
  }

  // Staff
  const sel = document.getElementById('staffList');
  const staffCountEl = document.getElementById('staffCount');
  if (staffCountEl) staffCountEl.textContent = DB.staff.length ? `（${DB.staff.length}）` : '';
  if (!DB.staff.length) {
    sel.innerHTML = '<div class="sb-empty">右上の＋から追加できます</div>';
  } else {
    sel.innerHTML = DB.staff.map(s =>
      `<div class="staff-item" onclick="openEditStaff('${s.id}')">
        <span class="staff-icon">👤</span>
        <span class="item-name">${esc(s.name)}</span>
        <button class="item-del" data-id="${s.id}" onclick="event.stopPropagation();onDelStaff(this)">✕</button>
      </div>`
    ).join('');
  }
}

function bulkDelete() {

  if (!confirm(`選択した ${selectedBatches.size}件のバッチを削除しますか？`)) return;

function renderMatrix() {
  const dateList = getDaysToShow();
  const td = todayDs();

  // Header row
  let h = '<thead><tr>';
  h += `<th class="col-stage corner-cell">担当 / 日</th>`;
  for (const dateS of dateList) {
    const [dy, dm, dd] = dateS.split('-').map(Number);
    const dw = dow(dy, dm, dd);
    const isToday = dateS === td;
    const isSun = dw === 0, isSat = dw === 6;
    let cls = 'date-th';
    if (isToday) cls += ' today';
    else if (isSun || isSat) cls += ' weekend';
    if (isSun) cls += ' sun';
    if (isSat) cls += ' sat';
    const dlJobs = DB.jobs.filter(j => j.deadline === dateS);
    const flagHtml = dlJobs.length
      ? `<span class="d-flag" title="${dlJobs.map(j=>esc(j.name)).join(', ')}">🏁</span>` : '';
    h += `<th class="${cls}"><span class="d-num">${dd}</span><span class="d-dow">${DOW[dw]}</span>${flagHtml}</th>`;
  }
  h += '</tr></thead>';

  // Staff rows
  const colSpan = dateList.length + 1;
  h += '<tbody>';
  if (!DB.staff.length) {
    h += `<tr><td class="col-stage staff-th"><div class="staff-inner" style="color:#cbd5e1">— 未設定 —</div></td>`;
    for (const dateS of dateList) {
      const [dy,dm,dd] = dateS.split('-').map(Number);
      const dw = dow(dy,dm,dd);
      const isToday = dateS === td, isWknd = dw===0||dw===6;
      let cls = 'mcell';
      if (isToday) cls += ' today-col'; else if (isWknd) cls += ' weekend-col';
      h += `<td class="${cls}"><div class="cell-inner"></div></td>`;
    }
    h += '</tr>';
    h += `<tr><td colspan="${colSpan}" style="padding:16px;text-align:center;font-size:13px;color:var(--muted);border:none">
      左サイドバーの「スタッフ」欄 ＋ からスタッフを追加するとカレンダーが使えます
    </td></tr>`;
  }
  DB.staff.forEach((staff, si) => {
    const rowColor = ROW_COLORS[si % ROW_COLORS.length];
    h += '<tr>';
    const shiftable = DB.batches.some(b => b.staffId === staff.id && !b.done);
    h += `<td class="col-stage staff-th" style="background:${rowColor}">
      <div class="staff-inner" title="${esc(staff.name)}">${esc(staff.name)}</div>
      ${shiftable ? `<div class="staff-shift">
        <button onclick="shiftStaffSchedule('${staff.id}',-1)" title="${esc(staff.name)}の未完了予定をすべて1日前へ">−1日</button>
        <button onclick="shiftStaffSchedule('${staff.id}',1)" title="${esc(staff.name)}の未完了予定をすべて1日後へ">＋1日</button>
      </div>` : ''}
    </td>`;
    for (const dateS of dateList) {
      const [dy,dm,dd] = dateS.split('-').map(Number);
      const dw = dow(dy,dm,dd);
      const isToday = dateS === td;
      const isWknd = dw === 0 || dw === 6;
      let cls = 'mcell';
      if (isToday) cls += ' today-col';
      else if (isWknd) cls += ' weekend-col';

      const batches = DB.batches.filter(b => b.staffId === staff.id && b.date === dateS);

      // Heatmap background
      let heatStyle = '';
      if (!isToday && batches.length > 0) {
        const alpha = Math.min(batches.length * 0.07, 0.28).toFixed(2);
        heatStyle = `background:rgba(37,99,235,${alpha})`;
      } else if (!isToday && !isWknd) {
        heatStyle = `background:${rowColor}`;
      }

      // 選択モードでは全バッチを個別の選択可能カードとして表示
      let cards;
      if (selectMode) {
        cards = batches.map(cardHtml).join('');
        h += `<td class="${cls}" style="${heatStyle}" data-staffid="${staff.id}" data-date="${dateS}">
          <div class="cell-inner">${cards}</div></td>`;
        continue;
      }
      // 未完了は通常カード、完了は案件ごとにコンパクトにまとめる
      const activeBatches = batches.filter(b => !b.done);
      const doneBatches = batches.filter(b => b.done);
      cards = activeBatches.map(cardHtml).join('');

      const doneByJob = {};
      doneBatches.forEach(b => { (doneByJob[b.jobId] = doneByJob[b.jobId] || []).push(b); });
      Object.keys(doneByJob).forEach(jobId => {
        const grp = doneByJob[jobId];
        const job = jobById(jobId); if (!job) return;
        const key = `${staff.id}|${dateS}|${jobId}`;
        if (expandedDone.has(key)) {
          cards += `<div class="done-collapse" onclick="toggleDoneGroup('${key}')">▲ 完了をまとめる</div>`;
          cards += grp.map(cardHtml).join('');
        } else {
          const stages = grp.slice()
            .sort((a, b) => PIPELINE.indexOf(a.stage) - PIPELINE.indexOf(b.stage))
            .map(b => `<span class="dg-stage">${STAGE_SHORT[b.stage] || esc(b.stage || '')}</span>`).join('');
          const qtyShown = Math.max.apply(null, grp.map(b => b.qty));
          cards += `<div class="done-group" onclick="toggleDoneGroup('${key}')" title="タップで展開">
            <span class="dg-dot" style="background:${job.color}"></span>
            <span class="dg-check">✓</span>
            <span class="dg-name">${esc(job.name)}</span>
            ${stages}
            <span class="dg-qty">${qtyShown}個</span>
          </div>`;
        }
      });

      h += `<td class="${cls}" style="${heatStyle}" data-staffid="${staff.id}" data-date="${dateS}"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event)">
        <div class="cell-inner">
          ${cards}
          <button class="cell-add" data-staffid="${staff.id}" data-date="${dateS}"
            onclick="onCellAdd(event)">+</button>
        </div>
      </td>`;
    }
    h += '</tr>';
  });
  h += '</tbody>';
  const matEl = document.getElementById('matrix');
  if (matEl) matEl.innerHTML = h;
}

function scrollToToday() {
  const wrap = document.getElementById('matrixWrap');
  const todayTh = wrap.querySelector('.date-th.today');
  if (todayTh) {
    const wRect = wrap.getBoundingClientRect();
    const cRect = todayTh.getBoundingClientRect();
    wrap.scrollLeft += cRect.left - wRect.left - 120;
  }
}

// ─── Month nav ───────────────────────────────────────────────────────────────
function shiftMonth(d) {
  if (view.mode === 'month') {
    view.m += d;
    if (view.m > 12) { view.m = 1; view.y++; }
    if (view.m < 1)  { view.m = 12; view.y--; }
  } else {
    const n = view.mode === 'week' ? 7 : 14;
    const start = new Date(view.weekStart + 'T00:00:00');
    start.setDate(start.getDate() + d * n);
    view.weekStart = ds(start.getFullYear(), start.getMonth()+1, start.getDate());
  }
  render();
}
function goToday() {
  const n = new Date();
  view.y = n.getFullYear(); view.m = n.getMonth() + 1;
  if (view.mode !== 'month') {
    const day = n.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(n); mon.setDate(n.getDate() + diff);
    view.weekStart = ds(mon.getFullYear(), mon.getMonth()+1, mon.getDate());
  }
  render(); scrollToToday();
}

// 担当の未完了予定をまとめて delta 日ずらす
function shiftStaffSchedule(staffId, delta) {
  const s = staffById(staffId);
  if (!s) return;
  const batches = DB.batches.filter(b => b.staffId === staffId && !b.done);
  if (!batches.length) { toast('ずらせる予定（未完了）がありません'); return; }
  snapshotForUndo();
  for (const b of batches) {
    const d = new Date(b.date + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    b.date = ds(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  save(); setTimeout(render, 0);
  const lbl = delta > 0 ? `+${delta}` : `${delta}`;
  showUndo(`${s.name}の予定${batches.length}件を${lbl}日ずらしました`);
}
// 案件の残り（未完了）バッチの日付をまとめて delta 日ずらす

  if (!editJobId) return;

function onCellAdd(event) {
