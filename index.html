function openAddBatch(staffId, date) {
  if (!DB.jobs.length) { toast('先に案件を追加してください'); return; }

  // 完成していない案件のうち、まだカレンダーに置いていない残数がある
  // or いま作業中カードが1枚も無いものを表示。
  // （工程を問わず全数を配置済み＆作業中カードありの案件は ▶ で進めるので出さない。
  //   ただしカードを削除した案件は作業中カードが無くなるので再び選べる）
  const availJobs = DB.jobs.filter(j =>
    !j.archived && !jobIsComplete(j) &&
    (jobRemainingQty(j) > 0 || !jobHasActiveBatch(j))
  );
  if (!availJobs.length) {
    toast('追加できる案件がありません');
    return;
  }

  batchCtx = { staffId, date };
  const s = staffById(staffId);
  const [, mm, dd] = date.split('-');
  document.getElementById('batchHead').textContent =
    `バッチを追加 — ${s ? s.name : ''}・${+mm}/${+dd}`;

  const jobSel = document.getElementById('fBatchJob');
  jobSel.innerHTML = availJobs.map(j => {
    const r = jobRemainingQty(j);
    const note = r > 0 ? `${j.totalQty}個 / 未配置${r}個` : `${j.totalQty}個`;
    return `<option value="${j.id}">${esc(j.name)}（${note}）</option>`;
  }).join('');

  renderStageChips('addStageChips', 'fBatchStage', STAGES[0]);

  const firstJob = jobById(jobSel.value);
  document.getElementById('fBatchQty').value = firstJob ? defaultBatchQty(firstJob) : 1;
  jobSel.onchange = () => {
    const job = jobById(jobSel.value);
    if (job) document.getElementById('fBatchQty').value = defaultBatchQty(job);
  };

  openOv('ovBatch');
}
function submitBatch() {
  const jobId = document.getElementById('fBatchJob').value;
  const stage = document.getElementById('fBatchStage').value;
  const qty = parseInt(document.getElementById('fBatchQty').value, 10);
  if (!qty || qty < 1) { toast('数量を入力してください'); return; }
  DB.batches.push({ id: uid(), jobId, qty, staffId: batchCtx.staffId, stage, date: batchCtx.date, done: false });
  closeOv('ovBatch');
  save();
  setTimeout(render, 0);
}

// ─── Card Detail ─────────────────────────────────────────────────────────────
function onCardClick(event) {
  if (justDragged) return;
  event.stopPropagation();
  openDetail(event.currentTarget.dataset.id);
}
function openDetail(batchId) {
  activeId = batchId;
  const b = batchById(batchId);
  if (!b) return;
  const job = jobById(b.jobId);
  const staff = staffById(b.staffId);
  if (!job) return;

  document.getElementById('dBar').style.background = job.color;
  document.getElementById('dName').textContent = job.name;
  document.getElementById('dSub').textContent = `案件合計 ${job.totalQty}個`;
  // 担当（選択で移動）
  const staffSel = document.getElementById('dStaffEdit');
  staffSel.innerHTML = DB.staff.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  staffSel.value = b.staffId;
  // 日付（変更で移動）
  document.getElementById('dDateEdit').value = b.date;

  renderStageChips('dStageChips', 'dStageEdit', b.stage || STAGES[0]);
  document.getElementById('dQtyEdit').value = b.qty;
  document.getElementById('dMinutes').value = (b.minutes != null ? b.minutes : '');

  // 次工程ボタン：パイプライン工程かつ最終工程でないときだけ表示
  const nextBtn = document.getElementById('btnNextStage');
  if (nextBtn) {
    const idx = PIPELINE.indexOf(b.stage);
    const hasNext = idx >= 0 && idx < PIPELINE.length - 1;
    nextBtn.style.display = hasNext ? '' : 'none';
    if (hasNext) nextBtn.textContent = `✓完了→${PIPELINE[idx + 1]}`;
  }

  resetSplitUI();
  openOv('ovDetail');
}

// 工程チップ（タップ選択）を描画
function renderStageChips(containerId, hiddenId, current) {
  const c = document.getElementById(containerId);
  if (!c) return;
  c.innerHTML = STAGES.map(st =>
    `<button type="button" class="stage-chip${st === current ? ' sel' : ''}" data-stage="${esc(st)}"
       onclick="pickStageChip('${containerId}','${hiddenId}',this)">${esc(st)}</button>`
  ).join('');
  const hid = document.getElementById(hiddenId);
  if (hid) hid.value = current;
}
function pickStageChip(containerId, hiddenId, btn) {
  const st = btn.dataset.stage;
  const hid = document.getElementById(hiddenId);
  if (hid) hid.value = st;
  document.querySelectorAll('#' + containerId + ' .stage-chip')
    .forEach(el => el.classList.toggle('sel', el === btn));
}

// 現工程を完了にして次の工程のバッチを自動生成（同じ案件・数量・担当・日）。
// 次工程名を返す。次が無ければ null。
function advanceBatchStage(b) {
  const idx = PIPELINE.indexOf(b.stage);
  if (idx < 0 || idx >= PIPELINE.length - 1) return null;
  const next = PIPELINE[idx + 1];
  b.done = true;
  DB.batches.push({ id: uid(), jobId: b.jobId, qty: b.qty, staffId: b.staffId, stage: next, date: b.date, done: false });
  return next;
}
// カード詳細モーダルから「次の工程へ」
function addNextStage() {
  const b = batchById(activeId);
  if (!b) return;
  const next = advanceBatchStage(b);
  if (!next) { toast('次の工程がありません'); return; }
  closeOv('ovDetail');
  toast(`「${next}」を追加しました（担当・日はドラッグで調整）`);
  save(); setTimeout(render, 0);
}
// マトリクスのカード上の ▶ ボタンから「次の工程へ」（モーダルを開かず1タップ）
function advanceStage(event, id) {
  event.stopPropagation();
  const b = batchById(id);
  if (!b) return;
  const next = advanceBatchStage(b);
  if (!next) { toast('次の工程がありません'); return; }
  toast(`「${next}」を追加しました（担当・日はドラッグで調整）`);
  save(); setTimeout(render, 0);
}

function saveBatchEdit() {
  const b = batchById(activeId);
  if (!b) return;
  const stage = document.getElementById('dStageEdit').value;
  const qty = parseInt(document.getElementById('dQtyEdit').value, 10);
  if (!qty || qty < 1) { toast('数量は1個以上にしてください'); return; }
  const minRaw = document.getElementById('dMinutes').value;
  const newStaffId = document.getElementById('dStaffEdit').value || b.staffId;
  const newDate = document.getElementById('dDateEdit').value || b.date;
  const moved = (newStaffId !== b.staffId) || (newDate !== b.date);
  snapshotForUndo();
  b.stage = stage;
  b.qty = qty;
  b.minutes = (minRaw === '' ? null : Math.max(0, parseInt(minRaw, 10) || 0));
  b.staffId = newStaffId;
  b.date = newDate;
  closeOv('ovDetail');
  save(); setTimeout(render, 0);
  if (moved) showUndo('担当・日付を変更しました'); else toast('変更を保存しました');
}
// カード詳細の日付を ±1日ずらす（保存で反映）
function shiftDetailDate(delta) {
  const el = document.getElementById('dDateEdit');
  const base = el.value ? new Date(el.value + 'T00:00:00') : new Date();
  base.setDate(base.getDate() + delta);
  el.value = ds(base.getFullYear(), base.getMonth() + 1, base.getDate());
}
function resetSplitUI() {
  document.getElementById('splitSec').style.display = 'none';
  document.getElementById('btnSplitToggle').textContent = '✂ 分割';
  document.getElementById('btnSplitOk').style.display = 'none';
  document.getElementById('splitErr').textContent = '';
}
function toggleSplit() {
  const sec = document.getElementById('splitSec');
  if (sec.style.display === 'none') {
    const b = batchById(activeId);
    if (!b) return;
    if (b.qty < 2) { toast('数量が1個のため分割できません'); return; }
    sec.style.display = '';
    document.getElementById('btnSplitToggle').textContent = 'キャンセル';
    document.getElementById('btnSplitOk').style.display = '';
    document.getElementById('fSplitA').value = Math.floor(b.qty / 2);
    onSplitInput();
    document.getElementById('fSplitA').focus();
  } else {
    resetSplitUI();
  }
}
function onSplitInput() {
  const b = batchById(activeId);
  if (!b) return;
  const a = parseInt(document.getElementById('fSplitA').value, 10) || 0;
  const bv = b.qty - a;
  document.getElementById('splitB').textContent = bv > 0 ? bv : '—';
  document.getElementById('splitErr').textContent =
    (a < 1 || bv < 1) ? '各バッチは1個以上必要です' : '';
}
function doSplit() {
  const b = batchById(activeId);
  if (!b) return;
  const a = parseInt(document.getElementById('fSplitA').value, 10);
  const bv = b.qty - a;
  if (a < 1 || bv < 1) { toast('各バッチは1個以上必要です'); return; }
  b.qty = a;
  DB.batches.push({ id: uid(), jobId: b.jobId, qty: bv, staffId: b.staffId, stage: b.stage, date: b.date, done: false });
  closeOv('ovDetail');
  toast(`${a}個 ＋ ${bv}個 に分割しました`);
  save(); setTimeout(render, 0);
}
function doDeleteBatch() {
  const b = batchById(activeId);
  if (!b) return;
  if (!confirm(`このバッチ（${b.qty}個）を削除しますか？`)) return;
  snapshotForUndo();
  DB.batches = DB.batches.filter(x => x.id !== activeId);
  closeOv('ovDetail');
  showUndo('バッチを削除しました');
  save(); setTimeout(render, 0);
}

// ─── Drag & Drop ─────────────────────────────────────────────────────────────
function onDragStart(event) {
  dragId = event.currentTarget.dataset.id;
  event.dataTransfer.effectAllowed = 'move';
  requestAnimationFrame(() => {
    const el = document.querySelector(`.card[data-id="${dragId}"]`);
    if (el) el.classList.add('dragging');
  });
}
function onDragEnd() {
  document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.mcell.over').forEach(el => el.classList.remove('over'));
  dragId = null;
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 250);
}
function onDragOver(event) {
  if (!dragId) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('over');
}
function onDragLeave(event) {
  const to = event.relatedTarget;
  if (!to || !event.currentTarget.contains(to)) {
    event.currentTarget.classList.remove('over');
  }
}
function onDrop(event) {
  event.preventDefault();
  const cell = event.currentTarget;
  cell.classList.remove('over');
  if (!dragId) return;
  const newStaffId = cell.dataset.staffid;
  const newDate = cell.dataset.date;
  const b = batchById(dragId);
  if (!b || (b.staffId === newStaffId && b.date === newDate)) return;
  snapshotForUndo();
  b.staffId = newStaffId;
  b.date = newDate;
  save();
  setTimeout(render, 0);
  showUndo('移動しました');
}

// ─── Summary ─────────────────────────────────────────────────────────────────
function openSummary() {
  const dateList = getDaysToShow();
  const label = getViewLabel();
  document.getElementById('sumTitle').textContent = `📊 サマリー — ${label}`;

  // Batches in this period
  const dateSet = new Set(dateList);
  const periodBatches = DB.batches.filter(b => dateSet.has(b.date));
  // 製品としての実数＝最終工程（仕上げ）が完了した個数。工程をまたいで二重に数えない
  const lastStage  = PIPELINE[PIPELINE.length - 1];
  const finishQty  = periodBatches.filter(b => b.done && b.stage === lastStage).reduce((s, b) => s + b.qty, 0);
  // 延べ作業＝全工程の合計（1個を7工程流せば7個ぶんの作業）
  const schedQty   = periodBatches.reduce((s, b) => s + b.qty, 0);
  const doneQty    = periodBatches.filter(b => b.done).reduce((s, b) => s + b.qty, 0);
  const pct        = schedQty > 0 ? Math.round(doneQty / schedQty * 100) : 0;
  // 期間内に完成した案件（案件の個数ベース）
  const finishedJobs = DB.jobs.filter(j => { const cd = jobCompletionDate(j); return cd && dateSet.has(cd); });
  const finishedJobQty = finishedJobs.reduce((s, j) => s + (j.totalQty || 0), 0);

  // Stats cards
  let html = `<div class="sum-stats">
    <div class="sum-stat">
      <div class="sum-stat-val" style="color:#22c55e">${finishQty}個</div>
      <div class="sum-stat-label">完成（製品の実数）</div>
    </div>
    <div class="sum-stat">
      <div class="sum-stat-val">${schedQty}個</div>
      <div class="sum-stat-label">延べ作業（全工程）</div>
    </div>
    <div class="sum-stat">
      <div class="sum-stat-val" style="color:${pct>=100?'#22c55e':pct>=50?'#3b82f6':'#f97316'}">${pct}%</div>
      <div class="sum-stat-label">作業完了率</div>
    </div>
  </div>
  <p style="color:var(--muted);font-size:11px;line-height:1.6;margin:-12px 0 16px">
    ※「完成」は最終工程（${esc(lastStage)}）まで終わった<b>製品の個数</b>。「延べ作業」は1個を7工程流すと7個と数える<b>作業量</b>です。</p>`;

  // 期間内に完成した案件（案件の個数ベース）
  html += `<div class="sum-section"><div class="sum-section-title">完成した案件（${label}）</div>`;
  if (finishedJobs.length) {
    let rev = 0, rowsF = '';
    for (const j of finishedJobs) {
      const cd = jobCompletionDate(j);
      const r = (j.unitPrice != null && j.unitPrice > 0) ? j.unitPrice * (j.totalQty || 0) : 0;
      rev += r;
      rowsF += `<tr>
        <td style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${j.color};margin-right:6px;vertical-align:middle"></span>${esc(j.name)}</td>
        <td style="font-weight:700">${j.totalQty}個</td>
        <td>${cd.slice(5).replace('-', '/')}</td>
        <td>${r ? '¥' + r.toLocaleString() : '—'}</td>
      </tr>`;
    }
    html += `<table class="sum-table"><thead><tr><th>案件名</th><th>個数</th><th>完成日</th><th>売上</th></tr></thead><tbody>${rowsF}
      <tr style="border-top:2px solid var(--border)"><td style="font-weight:800">${finishedJobs.length}件 計</td><td style="font-weight:800">${finishedJobQty}個</td><td></td><td style="font-weight:800">${rev ? '¥' + rev.toLocaleString() : '—'}</td></tr>
      </tbody></table>`;
  } else {
    html += '<p style="color:var(--muted);font-size:13px">この期間に完成した案件はありません</p>';
  }
  html += '</div>';

  // Monthly staff × stage pivot (always full month, done qty only)
  const staffMPrefix = `${String(view.y)}-${String(view.m).padStart(2,'0')}`;
  const staffMonthBatches = DB.batches.filter(b => b.date && b.date.startsWith(staffMPrefix));
  const sMonthLabel = `${view.y}年${view.m}月`;

  // Build pivot: staffId → stageLabel → doneQty
  // Also collect active stages (with at least one done batch)
  const pivotMap = {};   // staffId → { stage: doneQty }
  const activeStages = new Set();
  for (const b of staffMonthBatches) {
    if (!b.done) continue;
    const st = b.stage || 'その他';
    activeStages.add(st);
    if (!pivotMap[b.staffId]) pivotMap[b.staffId] = {};
    pivotMap[b.staffId][st] = (pivotMap[b.staffId][st] || 0) + b.qty;
  }
  // Sort stages by STAGES order, unknown stages appended
  const stageOrder = [...STAGES, 'その他'];
  const pivotStages = [...activeStages].sort((a, b) => {
    const ai = stageOrder.indexOf(a), bi = stageOrder.indexOf(b);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });

  html += `<div class="sum-section"><div class="sum-section-title">今月の工程実績（${sMonthLabel}）— 工程ごとの完了数</div>`;
  if (DB.staff.length && pivotStages.length) {
    // Scrollable wrapper for wide pivot table
    html += `<div style="overflow-x:auto"><table class="sum-table" style="min-width:max-content"><thead><tr>
      <th style="white-space:nowrap">スタッフ</th>`;
    for (const st of pivotStages) html += `<th style="white-space:nowrap">${esc(st)}</th>`;
    html += `<th style="white-space:nowrap;color:#22c55e">合計</th></tr></thead><tbody>`;

    // Column totals
    const colTotal = {};
    for (const st of pivotStages) colTotal[st] = 0;
    let grandTotal = 0;

    for (const s of DB.staff) {
      const sMap = pivotMap[s.id] || {};
      const rowTotal = pivotStages.reduce((sum, st) => sum + (sMap[st] || 0), 0);
      grandTotal += rowTotal;
      for (const st of pivotStages) colTotal[st] += (sMap[st] || 0);
      html += `<tr>
        <td style="font-weight:600;white-space:nowrap">👤 ${esc(s.name)}</td>`;
      for (const st of pivotStages) {
        const v = sMap[st] || 0;
        html += `<td style="text-align:center;${v>0?'font-weight:600;color:#1d4ed8':'color:#ccc'}">${v>0?v+'個':'—'}</td>`;
      }
      html += `<td style="text-align:center;font-weight:700;color:#22c55e">${rowTotal}個</td></tr>`;
    }

    // Total row
    html += `<tr style="background:#f1f5f9;font-weight:700">
      <td>合計</td>`;
    for (const st of pivotStages) {
      html += `<td style="text-align:center;color:#1d4ed8">${colTotal[st]}個</td>`;
    }
    html += `<td style="text-align:center;color:#22c55e">${grandTotal}個</td></tr>`;
    html += `</tbody></table></div>`;
  } else if (!DB.staff.length) {
    html += '<p style="color:var(--muted);font-size:13px">スタッフが登録されていません</p>';
  } else {
    html += '<p style="color:var(--muted);font-size:13px">今月の完了バッチがありません</p>';
  }
  html += '</div>';

  // Monthly staff progress (予定 vs 完了)
  html += `<div class="sum-section"><div class="sum-section-title">月産スタッフ別進捗（${sMonthLabel}）— 延べ作業数</div>`;
  if (DB.staff.length) {
    html += `<table class="sum-table"><thead><tr>
      <th>スタッフ</th><th>予定</th><th>完了</th><th>残り</th><th>完了率</th>
    </tr></thead><tbody>`;
    for (const s of DB.staff) {
      const sb = staffMonthBatches.filter(b => b.staffId === s.id);
      const sq = sb.reduce((a, b) => a + b.qty, 0);
      const dq = sb.filter(b => b.done).reduce((a, b) => a + b.qty, 0);
      const remain = sq - dq;
      const sp = sq > 0 ? Math.round(dq / sq * 100) : 0;
      const isFull = sp >= 100;
      html += `<tr>
        <td style="font-weight:600">${esc(s.name)}</td>
        <td>${sq}個</td>
        <td style="color:#22c55e;font-weight:600">${dq}個</td>
        <td style="color:${remain>0?'#f97316':'#22c55e'};font-weight:600">${remain}個</td>
        <td>
          ${sp}%
          <span class="sum-bar-wrap"><span class="sum-bar-fill${isFull?' done-full':''}" style="width:${sp}%"></span></span>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<p style="color:var(--muted);font-size:13px">スタッフが登録されていません</p>';
  }
  html += '</div>';

  // Period staff breakdown (week/2week only)
  if (view.mode !== 'month') {
    html += `<div class="sum-section"><div class="sum-section-title">スタッフ別（表示期間）— 延べ作業数</div>`;
    if (DB.staff.length) {
      html += `<table class="sum-table"><thead><tr>
        <th>スタッフ</th><th>予定</th><th>完了</th><th>完了率</th>
      </tr></thead><tbody>`;
      for (const s of DB.staff) {
        const sb = periodBatches.filter(b => b.staffId === s.id);
        const sq = sb.reduce((a, b) => a + b.qty, 0);
        const dq = sb.filter(b => b.done).reduce((a, b) => a + b.qty, 0);
        const sp = sq > 0 ? Math.round(dq / sq * 100) : 0;
        const isFull = sp >= 100;
        html += `<tr>
          <td style="font-weight:600">${esc(s.name)}</td>
          <td>${sq}個</td>
          <td style="color:#22c55e;font-weight:600">${dq}個</td>
          <td>
            ${sp}%
            <span class="sum-bar-wrap"><span class="sum-bar-fill${isFull?' done-full':''}" style="width:${sp}%"></span></span>
          </td>
        </tr>`;
      }
      html += '</tbody></table>';
    } else {
      html += '<p style="color:var(--muted);font-size:13px">スタッフが登録されていません</p>';
    }
    html += '</div>';
  }

  // Job breakdown
  html += `<div class="sum-section"><div class="sum-section-title">案件別進捗</div>`;
  if (DB.jobs.length) {
    html += `<table class="sum-table"><thead><tr>
      <th>案件名</th><th>ステータス</th><th>完了 / 総数</th><th>進捗</th>
    </tr></thead><tbody>`;
    for (const j of DB.jobs) {
      const dq = jobFinishedQty(j);
      const jp = j.totalQty > 0 ? Math.round(dq / j.totalQty * 100) : 0;
      const isFull = jp >= 100;
      const status = j.status || '未着手';
      html += `<tr>
        <td style="font-weight:600">
          <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${j.color};margin-right:6px;vertical-align:middle"></span>
          ${esc(j.name)}
        </td>
        <td><span class="status-badge ${STATUS_CLS[status]||'s-未着手'}">${status}</span></td>
        <td>${dq} / ${j.totalQty}個</td>
        <td>
          ${jp}%
          <span class="sum-bar-wrap"><span class="sum-bar-fill${isFull?' done-full':''}" style="width:${jp}%"></span></span>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<p style="color:var(--muted);font-size:13px">案件がありません</p>';
  }
  html += '</div>';

  // 売上予測（単価 × 個数）
  const priced = DB.jobs.filter(j => !j.archived && j.unitPrice != null && j.unitPrice > 0);
  html += `<div class="sum-section"><div class="sum-section-title">売上予測</div>`;
  if (priced.length) {
    let totForecast = 0, totConfirmed = 0, rows = '';
    for (const j of priced) {
      const price = j.unitPrice;
      const forecast = price * (j.totalQty || 0);
      const confirmed = price * jobFinishedQty(j);
      totForecast += forecast; totConfirmed += confirmed;
      rows += `<tr>
        <td style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${j.color};margin-right:6px;vertical-align:middle"></span>${esc(j.name)}</td>
        <td>¥${price.toLocaleString()}</td>
        <td>¥${forecast.toLocaleString()}</td>
        <td style="color:#16a34a">¥${confirmed.toLocaleString()}</td>
      </tr>`;
    }
    const totRemaining = totForecast - totConfirmed;
    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div class="fc-card"><div class="fc-label">予測売上 合計</div><div class="fc-val">¥${totForecast.toLocaleString()}</div></div>
      <div class="fc-card"><div class="fc-label">確定（完成分）</div><div class="fc-val" style="color:#16a34a">¥${totConfirmed.toLocaleString()}</div></div>
      <div class="fc-card"><div class="fc-label">残り（未完成分）</div><div class="fc-val" style="color:#b45309">¥${totRemaining.toLocaleString()}</div></div>
    </div>`;
    html += `<table class="sum-table"><thead><tr><th>案件名</th><th>単価</th><th>予測売上</th><th>確定</th></tr></thead><tbody>${rows}</tbody></table>`;
    const noPrice = DB.jobs.filter(j => !j.archived && !(j.unitPrice != null && j.unitPrice > 0)).length;
    if (noPrice) html += `<p style="color:var(--muted);font-size:12px;margin-top:6px">※単価未設定の案件が${noPrice}件あります（予測に含まれていません）</p>`;
  } else {
    html += '<p style="color:var(--muted);font-size:13px">単価を設定した案件がありません（案件の編集で「単価」を入力すると予測が出ます）</p>';
  }
  html += '</div>';

  // 月別売上（完成月ベース）と年間売上
  const smap = salesByMonth();
  const smKeys = Object.keys(smap);
  html += `<div class="sum-section"><div class="sum-section-title">月別売上（${view.y}年・完成月ベース）</div>`;
  if (smKeys.length) {
    let yearRev = 0, yearJobs = 0, yearQty = 0, rows2 = '';
    for (let m = 1; m <= 12; m++) {
      const ym = `${view.y}-${String(m).padStart(2, '0')}`;
      const v = smap[ym];
      if (!v) continue;
      yearRev += v.revenue; yearJobs += v.jobs; yearQty += v.qty;
      rows2 += `<tr><td style="font-weight:600">${m}月</td><td style="font-weight:700">¥${v.revenue.toLocaleString()}</td><td>${v.jobs}件</td><td>${v.qty}個</td></tr>`;
    }
    if (rows2) {
      html += `<table class="sum-table"><thead><tr><th>月</th><th>売上</th><th>完成案件</th><th>個数</th></tr></thead><tbody>${rows2}
        <tr style="border-top:2px solid var(--border)"><td style="font-weight:800">${view.y}年 計</td><td style="font-weight:800">¥${yearRev.toLocaleString()}</td><td>${yearJobs}件</td><td>${yearQty}個</td></tr>
        </tbody></table>`;
    } else {
      html += `<p style="color:var(--muted);font-size:13px">${view.y}年に完成した売上はまだありません</p>`;
    }
    // 年間売上（全年）
    const byYear = {};
    for (const k of smKeys) { const y = k.slice(0, 4); byYear[y] = (byYear[y] || 0) + smap[k].revenue; }
    const years = Object.keys(byYear).sort();
    if (years.length) {
      html += `<div class="sum-section-title" style="margin-top:14px">年間売上</div>`;
      html += `<table class="sum-table"><thead><tr><th>年</th><th>売上</th></tr></thead><tbody>`;
      for (const y of years) {
        html += `<tr${y == view.y ? ' style="background:#eff6ff"' : ''}><td style="font-weight:600">${y}年</td><td style="font-weight:700">¥${byYear[y].toLocaleString()}</td></tr>`;
      }
      html += `</tbody></table>`;
    }
  } else {
    html += '<p style="color:var(--muted);font-size:13px">完成した案件の売上がまだありません（単価を設定し、案件を完成にすると計上されます）</p>';
  }
  html += '</div>';

  // 作業時間・時給（売上 ÷ 作業時間）
  const timed = DB.jobs.filter(j => !j.archived && jobMinutes(j) > 0 && j.unitPrice != null && j.unitPrice > 0);
  html += `<div class="sum-section"><div class="sum-section-title">作業時間・時給（売上 ÷ 時間）</div>`;
  if (timed.length) {
    let totRev = 0, totMin = 0, totMat = 0, rows3 = '';
    for (const j of timed) {
      const min = jobMinutes(j);
      const rev = j.unitPrice * (j.totalQty || 0);
      const hourly = min > 0 ? Math.round(rev / (min / 60)) : 0;
      totRev += rev; totMin += min; totMat += jobMatCost(j);
      rows3 += `<tr><td style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${j.color};margin-right:6px;vertical-align:middle"></span>${esc(j.name)}</td><td>${(min/60).toFixed(1)}h</td><td>¥${rev.toLocaleString()}</td><td style="font-weight:700">¥${hourly.toLocaleString()}/h</td></tr>`;
    }
    const avgHourly = totMin > 0 ? Math.round(totRev / (totMin / 60)) : 0;
    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div class="fc-card"><div class="fc-label">平均時給</div><div class="fc-val">¥${avgHourly.toLocaleString()}/h</div></div>
      <div class="fc-card"><div class="fc-label">合計作業時間</div><div class="fc-val">${(totMin/60).toFixed(1)}h</div></div>
      ${totMat > 0 ? `<div class="fc-card"><div class="fc-label">粗利ベース時給</div><div class="fc-val" style="color:#16a34a">¥${(totMin > 0 ? Math.round((totRev - totMat) / (totMin / 60)) : 0).toLocaleString()}/h</div></div>` : ''}
    </div>`;
    html += `<table class="sum-table"><thead><tr><th>案件名</th><th>時間</th><th>売上</th><th>時給</th></tr></thead><tbody>${rows3}</tbody></table>`;
    html += `<p style="color:var(--muted);font-size:12px;margin-top:6px">※各カードの詳細で「作業時間（分）」を入力すると集計されます</p>`;
  } else {
    html += '<p style="color:var(--muted);font-size:13px">作業時間の記録がありません（カードをタップ →「作業時間（分）」を入力）</p>';
  }
  html += '</div>';

  // 原価・粗利（売上 − 材料費）
  const costJobs = DB.jobs.filter(j => !j.archived && j.unitPrice != null && j.unitPrice > 0 && jobBom(j).length);
  html += `<div class="sum-section"><div class="sum-section-title">原価・粗利（売上 − 材料費）</div>`;
  if (costJobs.length) {
    let tRev = 0, tCost = 0, rowsC = '';
    for (const j of costJobs) {
      const rev = j.unitPrice * (j.totalQty || 0);
      const cost = jobMatCost(j);
      const pf = rev - cost;
      const rate = rev > 0 ? Math.round(pf / rev * 100) : 0;
      tRev += rev; tCost += cost;
      rowsC += `<tr>
        <td style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${j.color};margin-right:6px;vertical-align:middle"></span>${esc(j.name)}</td>
        <td>¥${Math.round(rev).toLocaleString()}</td>
        <td style="color:#b45309">¥${Math.round(cost).toLocaleString()}</td>
        <td style="font-weight:700;color:${pf >= 0 ? '#16a34a' : '#dc2626'}">¥${Math.round(pf).toLocaleString()}</td>
        <td>${rate}%</td>
      </tr>`;
    }
    const tPf = tRev - tCost;
    const tRate = tRev > 0 ? Math.round(tPf / tRev * 100) : 0;
    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div class="fc-card"><div class="fc-label">売上（対象案件）</div><div class="fc-val">¥${Math.round(tRev).toLocaleString()}</div></div>
      <div class="fc-card"><div class="fc-label">材料費</div><div class="fc-val" style="color:#b45309">¥${Math.round(tCost).toLocaleString()}</div></div>
      <div class="fc-card"><div class="fc-label">粗利（${tRate}%）</div><div class="fc-val" style="color:#16a34a">¥${Math.round(tPf).toLocaleString()}</div></div>
    </div>`;
    html += `<table class="sum-table"><thead><tr><th>案件名</th><th>売上</th><th>材料費</th><th>粗利</th><th>粗利率</th></tr></thead><tbody>${rowsC}</tbody></table>`;
  } else {
    html += '<p style="color:var(--muted);font-size:13px">単価と使用資材の両方を設定した案件がありません（📦資材管理で資材を登録 → 案件編集で「使用資材」を設定）</p>';
  }
  html += '</div>';

  // 資材・在庫
  const matStats = materialStats();
  html += `<div class="sum-section"><div class="sum-section-title">📦 資材・在庫</div>`;
  if ((DB.materials || []).length) {
    let stockVal = 0, rowsM = '';
    for (const m of DB.materials) {
      const s = matStats[m.id] || { stock: 0, reserved: 0, free: 0, used: 0 };
      stockVal += (m.price || 0) * Math.max(s.stock, 0);
      const bad = s.free < 0;
      rowsM += `<tr>
        <td style="font-weight:600">${esc(m.name)}<span style="color:var(--muted);font-weight:400"> (${esc(m.unit)})</span></td>
        <td>${numShort(s.stock)}</td>
        <td style="color:#b45309">${numShort(s.reserved)}</td>
        <td style="font-weight:700;color:${bad ? '#dc2626' : '#16a34a'}">${numShort(s.free)}</td>
        <td>${numShort(s.used)}</td>
      </tr>`;
    }
    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div class="fc-card"><div class="fc-label">在庫金額</div><div class="fc-val">¥${Math.round(stockVal).toLocaleString()}</div></div>
      <div class="fc-card"><div class="fc-label">登録資材</div><div class="fc-val">${DB.materials.length}種</div></div>
    </div>`;
    html += `<table class="sum-table"><thead><tr><th>資材</th><th>在庫</th><th>引当</th><th>過不足</th><th>消費済</th></tr></thead><tbody>${rowsM}</tbody></table>`;
    // 発注リスト
    const roL = reorderList();
    if (roL.length) {
      const roTotal = roL.reduce((s, r) => s + r.cost, 0);
      html += `<div class="sum-section-title" style="margin-top:14px">🛒 発注リスト（概算 ¥${Math.round(roTotal).toLocaleString()}）</div>`;
      html += `<table class="sum-table"><thead><tr><th>資材</th><th>理由</th><th>発注量</th><th>概算金額</th></tr></thead><tbody>`;
      for (const r of roL) {
        html += `<tr>
          <td style="font-weight:600">${esc(r.mat.name)}</td>
          <td>${r.reason}</td>
          <td style="font-weight:700;color:#dc2626">${numShort(r.need)}${esc(r.mat.unit)}</td>
          <td>${r.mat.price ? '¥' + Math.round(r.cost).toLocaleString() : '—'}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
    } else {
      html += `<p style="color:#16a34a;font-size:13px;font-weight:600;margin-top:10px">✓ 現在の予定に対して資材の不足はありません</p>`;
    }
  } else {
    html += '<p style="color:var(--muted);font-size:13px">資材が登録されていません（ヘッダーの📦ボタンから登録できます）</p>';
  }
  html += '</div>';

  // グラフ（月別売上・完成個数）
  const gmap = salesByMonth();
  const monthsData = [];
  for (let m = 1; m <= 12; m++) { const v = gmap[`${view.y}-${String(m).padStart(2,'0')}`]; monthsData.push({ m, rev: (v ? v.revenue : 0), qty: (v ? v.qty : 0) }); }
  const anyG = monthsData.some(d => d.rev > 0 || d.qty > 0);
  html += `<div class="sum-section"><div class="sum-section-title">グラフ（${view.y}年）</div>`;
  if (anyG) {
    const salesItems = monthsData.map(d => ({ label: d.m + '', value: d.rev, short: d.rev > 0 ? ('¥' + yenShort(d.rev)) : '' }));
    const qtyItems = monthsData.map(d => ({ label: d.m + '', value: d.qty, short: d.qty > 0 ? (d.qty + '個') : '' }));
    html += `<div style="font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 4px">月別売上</div>`;
    html += barChartSVG(salesItems, '#2563eb');
    html += `<div style="font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px">月別 完成個数</div>`;
    html += barChartSVG(qtyItems, '#16a34a');
  } else {
    html += '<p style="color:var(--muted);font-size:13px">グラフに表示するデータがまだありません</p>';
  }
  html += '</div>';

  // Monthly stage aggregation (always full month regardless of view mode)
  const mPrefix = `${String(view.y)}-${String(view.m).padStart(2,'0')}`;
  const monthBatches = DB.batches.filter(b => b.date && b.date.startsWith(mPrefix));
  const mStageMap = {};
  for (const b of monthBatches) {
    const st = b.stage || 'その他';
    if (!mStageMap[st]) mStageMap[st] = { qty: 0, done: 0 };
    mStageMap[st].qty += b.qty;
    if (b.done) mStageMap[st].done += b.qty;
  }
  const mStageEntries = Object.entries(mStageMap).sort((a, b) => b[1].qty - a[1].qty);
  const mMonthLabel = `${view.y}年${view.m}月`;
  html += `<div class="sum-section"><div class="sum-section-title">月産工程別集計（${mMonthLabel}）— 工程ごとの数</div>`;
  if (mStageEntries.length) {
    html += `<table class="sum-table"><thead><tr>
      <th>工程</th><th>予定</th><th>完了</th><th>残り</th><th>完了率</th>
    </tr></thead><tbody>`;
    for (const [stage, v] of mStageEntries) {
      const remain = v.qty - v.done;
      const sp = v.qty > 0 ? Math.round(v.done / v.qty * 100) : 0;
      const isFull = sp >= 100;
      html += `<tr>
        <td style="font-weight:600">${esc(stage)}</td>
        <td>${v.qty}個</td>
        <td style="color:#22c55e;font-weight:600">${v.done}個</td>
        <td style="color:${remain>0?'#f97316':'#22c55e'};font-weight:600">${remain}個</td>
        <td>
          ${sp}%
          <span class="sum-bar-wrap"><span class="sum-bar-fill${isFull?' done-full':''}" style="width:${sp}%"></span></span>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<p style="color:var(--muted);font-size:13px">今月のバッチがありません</p>';
  }
  html += '</div>';

  // Period stage breakdown (current view)
  if (view.mode !== 'month') {
    const stageMap = {};
    for (const b of periodBatches) {
      const st = b.stage || 'その他';
      if (!stageMap[st]) stageMap[st] = { count: 0, qty: 0, done: 0 };
      stageMap[st].count++;
      stageMap[st].qty += b.qty;
      if (b.done) stageMap[st].done += b.qty;
    }
    const stageEntries = Object.entries(stageMap).sort((a, b) => b[1].qty - a[1].qty);
    if (stageEntries.length) {
      html += `<div class="sum-section"><div class="sum-section-title">工程別内訳（表示期間）— 工程ごとの数</div>
      <table class="sum-table"><thead><tr>
        <th>工程</th><th>バッチ数</th><th>予定</th><th>完了</th>
      </tr></thead><tbody>`;
      for (const [stage, v] of stageEntries) {
        html += `<tr>
          <td style="font-weight:600">${esc(stage)}</td>
          <td>${v.count}</td>
          <td>${v.qty}個</td>
          <td style="color:#22c55e">${v.done}個</td>
        </tr>`;
      }
      html += '</tbody></table></div>';
    }
  }

  document.getElementById('sumBody').innerHTML = html;
  openOv('ovSummary');
}
// サマリー(レポート)だけを印刷
function printReport() {
  document.body.classList.add('print-report');
  const cleanup = () => { document.body.classList.remove('print-report'); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => window.print(), 60);
  setTimeout(cleanup, 3000);
}

// ─── 月次繰越（先月の未完了を今月へ） ─────────────────────────────────────────
function currentMonthKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;
}
// 繰越対象＝今月より前の日付に残っている未完了バッチ
function carryoverBatches() {
  const mk = currentMonthKey();
  return DB.batches
    .filter(b => !b.done && b.date && b.date.slice(0, 7) < mk)
    .sort((a, b) => a.date.localeCompare(b.date));
}
// 表示中の月の「案件一覧」に載せるべき案件か
//   ・その月にバッチを配置している → 載せる
//   ・まだカレンダーに置いていない残数がある（未完成） → 載せる（配置が必要なので）
//   ・それ以外（他の月だけに配置済み／完成済み／アーカイブ） → 載せない
function jobBelongsToViewMonth(j) {
  if (j.archived) return false;
  const mk = `${view.y}-${String(view.m).padStart(2, '0')}`;
  if (DB.batches.some(b => b.jobId === j.id && b.date && b.date.slice(0, 7) === mk)) return true;
  if (!jobIsComplete(j) && jobRemainingQty(j) > 0) return true;
  return false;
}
// 先月以前に完成した案件か（繰越ダイアログの案内用）
function isPastMonthDone(j) {
  if (!jobIsComplete(j)) return false;
  const cd = jobCompletionDate(j);
  if (!cd) return false;
  return cd.slice(0, 7) < currentMonthKey();
}
// まだカレンダーに置いていない残数がある未完成案件（繰越の注意喚起用）
function carryoverUnplacedJobs() {
  return DB.jobs.filter(j => !j.archived && !jobIsComplete(j) && jobRemainingQty(j) > 0);
}
// 月が変わったかを判定し、変わっていれば繰越を実行 or 確認
function checkMonthRollover() {
  const mk = currentMonthKey();
  if (!DB.lastMonth) { DB.lastMonth = mk; save(); return; }
  if (DB.lastMonth === mk) return;
  DB.lastMonth = mk;
  save();
  const items = carryoverBatches();
  const doneOff = DB.jobs.filter(j => !j.archived && isPastMonthDone(j));
  if (!items.length && !doneOff.length) return;
  if (DB.autoCarry) {
    if (items.length) doCarryover('today', true);
    return;
  }
  openCarryover(true);
}
function toggleAutoCarry() {
  DB.autoCarry = document.getElementById('fAutoCarry').checked;
  save();
  toast(DB.autoCarry ? '毎月自動で繰り越します' : '自動繰越をオフにしました');
}
function openCarryover(auto) {
  const items = carryoverBatches();
  const unplaced = carryoverUnplacedJobs();
  const n = new Date();
  document.getElementById('carryTitle').textContent = auto
    ? (items.length ? `📆 ${n.getMonth() + 1}月になりました — 先月までの未完了を繰り越しますか？` : `📆 ${n.getMonth() + 1}月になりました`)
    : '📆 未完了を今月へ繰り越す';
  document.getElementById('fAutoCarry').checked = !!DB.autoCarry;

  let h = '';
  // 先月以前に完成した案件は一覧から外れる旨を案内
  const doneOff = DB.jobs.filter(j => !j.archived && isPastMonthDone(j));
  if (doneOff.length) {
    h += `<p style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:12px">
      ✓ 完成済みの <b>${doneOff.length}件</b>（${doneOff.slice(0, 3).map(j => esc(j.name)).join('・')}${doneOff.length > 3 ? ' ほか' : ''}）は案件一覧から自動で外しました。<br>
      <span style="color:var(--muted);font-size:12px">売上・サマリーには残ります。見たいときは案件一覧の「完了・アーカイブ」ボタンから。</span></p>`;
  }
  if (!items.length && !unplaced.length) {
    h += '<p style="color:#16a34a;font-size:13px;font-weight:600">✓ 繰り越す未完了はありません</p>';
  }
  if (items.length) {
    // 案件ごとにまとめて表示
    const byJob = {};
    for (const b of items) { (byJob[b.jobId] = byJob[b.jobId] || []).push(b); }
    const totalQty = items.reduce((s, b) => s + b.qty, 0);
    h += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div class="fc-card"><div class="fc-label">繰越する予定</div><div class="fc-val" style="color:#b45309">${items.length}件</div></div>
      <div class="fc-card"><div class="fc-label">個数</div><div class="fc-val">${totalQty}個</div></div>
      <div class="fc-card"><div class="fc-label">最も古い予定</div><div class="fc-val" style="font-size:15px">${items[0].date.slice(5).replace('-', '/')}</div></div>
    </div>`;
    h += `<div class="sum-section-title">繰り越す予定</div>`;
    h += `<div style="overflow-x:auto"><table class="sum-table" style="min-width:max-content"><thead><tr>
      <th>案件</th><th>工程</th><th>担当</th><th>元の日付</th><th>個数</th></tr></thead><tbody>`;
    for (const jid in byJob) {
      const j = jobById(jid);
      for (const b of byJob[jid]) {
        const s = staffById(b.staffId);
        h += `<tr>
          <td style="font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${j ? j.color : '#94a3b8'};margin-right:6px;vertical-align:middle"></span>${esc(j ? j.name : '不明')}</td>
          <td>${esc(b.stage || '')}</td>
          <td>${esc(s ? s.name : '—')}</td>
          <td style="color:#b45309">${b.date.slice(5).replace('-', '/')}</td>
          <td>${b.qty}個</td>
        </tr>`;
      }
    }
    h += `</tbody></table></div>`;
    h += `<p style="color:var(--muted);font-size:12px;line-height:1.7;margin-top:8px">
      <b>今日にまとめる</b>…すべて今日の日付に移します（仕切り直し向け）<br>
      <b>間隔を保ってずらす</b>…一番古い予定が今日になるよう、予定の間隔をそのままスライドします</p>`;
  }
  if (unplaced.length) {
    h += `<div class="sum-section-title" style="margin-top:14px">まだカレンダーに置いていない残数</div>`;
    h += `<table class="sum-table"><thead><tr><th>案件</th><th>総数</th><th>配置済み</th><th>未配置</th></tr></thead><tbody>`;
    for (const j of unplaced) {
      h += `<tr>

        <td>${j.totalQty}個</td>
        <td>${jobScheduledQty(j.id)}個</td>
        <td style="font-weight:700;color:#b45309">${jobRemainingQty(j)}個</td>
      </tr>`;

    h += `<p style="color:var(--muted);font-size:12px;margin-top:6px">※未配置ぶんは案件一覧に残っています。カレンダーの＋から今月に置いてください。</p>`;
  }
  document.getElementById('carryBody').innerHTML = h;

  document.getElementById('carryTodayBtn').style.display = dis ? 'none' : '';
  document.getElementById('carrySpreadBtn').style.display = dis ? 'none' : '';
  document.getElementById('carryCloseBtn').textContent = dis ? '閉じる' : 'あとで';
  openOv('ovCarry');
}
// mode: 'today' = すべて今日へ / 'spread' = 間隔を保って今日からスライド
function doCarryover(mode, silent) {
  const items = carryoverBatches();
  if (!items.length) { toast('繰り越す予定はありません'); closeOv('ovCarry'); return; }
  snapshotForUndo();
  const today = todayDs();
  if (mode === 'spread') {
    const base = new Date(items[0].date + 'T00:00:00');
    const target = new Date(today + 'T00:00:00');
    const shift = Math.round((target - base) / 86400000);
    for (const b of items) {
      const d = new Date(b.date + 'T00:00:00');
      d.setDate(d.getDate() + shift);
      b.date = ds(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }
  } else {
    for (const b of items) b.date = today;
  }
  closeOv('ovCarry');
  save();
  goToday();
  showUndo(`${items.length}件の未完了を今月に繰り越しました${silent ? '（自動）' : ''}`);
}

  const qty = parseInt(document.getElementById('fJobQty').value, 10) || 0;

  const price = priceRaw === '' ? null : (parseFloat(priceRaw) || 0);

  if (price != null && price > 0) {
    const pf = price - unitCost;
    const rate = price > 0 ? Math.round(pf / price * 100) : 0;
    t += ` ／ 粗利 1個 ¥${Math.round(pf).toLocaleString()}（${rate}%）`;

  const missing = rows.filter(x => { const m = matById(x.matId); return !m || !m.price; }).length;
  if (missing) t += `　※単価未設定の資材が${missing}件`;

// ─── Touch Drag & Drop ───────────────────────────────────────────────────────
const DRAG_THRESHOLD = 8; // px — under this = tap, over this = drag

// ─── カレンダーのズーム（ピンチ／ボタン） ───────────────────────────────────────
let matrixZoom = 1;
let pinch = { active: false, startDist: 0, startZoom: 1 };
function setMatrixZoom(z) {
  matrixZoom = Math.round(Math.min(Math.max(z, 0.4), 1.3) * 100) / 100;
  const m = document.getElementById('matrix');
  if (m) m.style.zoom = matrixZoom;
  const pct = document.getElementById('zoomPct');
  if (pct) pct.textContent = Math.round(matrixZoom * 100) + '%';
}
function zoomStep(d) { setMatrixZoom(matrixZoom + d); saveZoom(); }
function resetMatrixZoom() { setMatrixZoom(1); saveZoom(); }
function saveZoom() { try { localStorage.setItem('seisan_matrixZoom', String(matrixZoom)); } catch(_) {} }
function resetTouchDrag() {
  if (touchDrag.clone) touchDrag.clone.remove();
  if (touchDrag.origCard) touchDrag.origCard.classList.remove('dragging');
  touchDrag = { id: null, clone: null, target: null, origCard: null, startX: 0, startY: 0, moved: false };
}
function pinchDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
function onWrapTouchStart(e) {
  if (e.touches.length === 2) {
    pinch.active = true;
    pinch.startDist = pinchDist(e.touches);
    pinch.startZoom = matrixZoom;
    resetTouchDrag(); // ドラッグ中なら中止
  }
}
function onWrapTouchMove(e) {
  if (pinch.active && e.touches.length === 2) {
    e.preventDefault();
    const d = pinchDist(e.touches);
    if (pinch.startDist > 0) setMatrixZoom(pinch.startZoom * (d / pinch.startDist));
  }
}
function onWrapTouchEnd(e) {
  if (pinch.active && e.touches.length < 2) { pinch.active = false; saveZoom(); }
}

function onTouchStart(e) {
  if (e.touches.length >= 2) { resetTouchDrag(); return; } // 2本指＝ピンチズーム、ドラッグしない
  const card = e.currentTarget;
  const touch = e.touches[0];
  // Record start position but don't create ghost yet (wait for threshold)
  touchDrag.id = card.dataset.id;
  touchDrag.origCard = card;
  touchDrag.startX = touch.clientX;
  touchDrag.startY = touch.clientY;
  touchDrag.moved = false;
  touchDrag.clone = null;
  touchDrag.target = null;
}

function onTouchMove(e) {
  if (!touchDrag.id) return;
  const touch = e.touches[0];

  if (!touchDrag.moved) {
    // Check if we've crossed the drag threshold
    const dx = touch.clientX - touchDrag.startX;
    const dy = touch.clientY - touchDrag.startY;
    if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return; // still a potential tap
    // Threshold crossed → start actual drag
    touchDrag.moved = true;
    const card = touchDrag.origCard;
    const rect = card.getBoundingClientRect();
    const clone = card.cloneNode(true);
    clone.className = 'touch-ghost';
    clone.style.width  = rect.width + 'px';
    clone.style.left   = (touch.clientX - rect.width / 2) + 'px';
    clone.style.top    = (touch.clientY - rect.height / 2) + 'px';
    clone.style.background = card.style.background;
    document.body.appendChild(clone);
    touchDrag.clone = clone;
    card.classList.add('dragging');
  }

  e.preventDefault(); // block scroll only during actual drag
  const w = touchDrag.clone.offsetWidth;
  touchDrag.clone.style.left = (touch.clientX - w / 2) + 'px';
  touchDrag.clone.style.top  = (touch.clientY - 28) + 'px';

  touchDrag.clone.style.display = 'none';
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  touchDrag.clone.style.display = '';

  if (touchDrag.target) touchDrag.target.classList.remove('over');
  const cell = el && el.closest('.mcell');
  if (cell) { cell.classList.add('over'); touchDrag.target = cell; }
  else touchDrag.target = null;
}

function onTouchEnd() {
  if (!touchDrag.id) return;
  if (touchDrag.clone)    { touchDrag.clone.remove(); touchDrag.clone = null; }
  if (touchDrag.origCard) { touchDrag.origCard.classList.remove('dragging'); }
  if (touchDrag.target)   { touchDrag.target.classList.remove('over'); }

  if (touchDrag.moved && touchDrag.target) {
    const b = batchById(touchDrag.id);
    const ns = touchDrag.target.dataset.staffid;
    const nd = touchDrag.target.dataset.date;
    if (b && ns && nd && !(b.staffId === ns && b.date === nd)) {
      snapshotForUndo();
      b.staffId = ns; b.date = nd;
      save(); setTimeout(render, 0);
      showUndo('移動しました');
    }
  }

  const wasDrag = touchDrag.moved;
  touchDrag = { id: null, clone: null, target: null, origCard: null, startX: 0, startY: 0, moved: false };

  // Only set justDragged if an actual drag happened — taps must NOT be blocked
  if (wasDrag) {
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 250);
  }
}

// ─── Today Panel ─────────────────────────────────────────────────────────────
function openTodayPanel() {
  const td = todayDs();
  const [ty,tm,tddd] = td.split('-').map(Number);
  document.getElementById('todayTitle').textContent =
    `📋 今日のタスク — ${ty}年${tm}月${tddd}日`;
  const todayBatches = DB.batches.filter(b => b.date === td);
  const list = document.getElementById('todayList');
  if (!todayBatches.length) {
    list.innerHTML = '<div class="today-empty">今日のタスクはありません</div>';
  } else {
    list.innerHTML = todayBatches.map(b => {
      const job = jobById(b.jobId); if (!job) return '';
      const staff = staffById(b.staffId);
      return `<div class="today-item${b.done?' done-item':''}">
        <div class="today-dot" style="background:${job.color}"></div>
        <div class="today-info">
          <div class="today-name">${esc(job.name)}</div>
          <div class="today-sub">${esc(b.stage||'—')}　${staff?esc(staff.name):'—'}</div>
        </div>
        <span class="today-qty">${b.qty}個</span>
        <button class="today-check" onclick="toggleDoneFromToday('${b.id}')">${b.done?'✓ 完了':'○'}</button>
      </div>`;
    }).join('');
  }
  openOv('ovToday');
}
function toggleDoneFromToday(batchId) {
  const b = batchById(batchId);
  if (!b) return;
  b.done = !b.done;
  save();
  openTodayPanel(); // refresh panel
  setTimeout(render, 0);
}

// 木曜始まりの「今週」の開始日（当日を含む直近の木曜）
function weekStartThu() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const offset = (now.getDay() - 4 + 7) % 7; // 木=4 からの経過日数
  const start = new Date(now); start.setDate(now.getDate() - offset);
  return start;
}
function openWeekPanel() {
  const start = weekStartThu();
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  const end = days[6];
  document.getElementById('weekTitle').textContent =
    `🗓 今週やること — ${start.getMonth()+1}/${start.getDate()}（木）〜 ${end.getMonth()+1}/${end.getDate()}（水）`;
  const td = todayDs();
  let html = '', totalTodo = 0;
  for (const d of days) {
    const dStr = ds(d.getFullYear(), d.getMonth()+1, d.getDate());
    const items = DB.batches.filter(b => b.date === dStr && !b.done);
    if (!items.length) continue;
    totalTodo += items.length;
    const isToday = dStr === td;
    html += `<div class="wk-day${isToday?' wk-today':''}">
      <div class="wk-day-head">${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}${isToday?' <span class="wk-todaytag">今日</span>':''}</div>
      <ul class="wk-list">`;
    for (const b of items) {
      const job = jobById(b.jobId); if (!job) continue;
      const staff = staffById(b.staffId);
      html += `<li class="wk-item">
        <span class="wk-dot" style="background:${job.color}"></span>
        <span class="wk-text"><b>${esc(job.name)}</b> — ${esc(b.stage||'—')}${staff?' / '+esc(staff.name):''} <span class="wk-qty">×${b.qty}個</span></span>
        <button class="wk-check" onclick="toggleDoneFromWeek('${b.id}')" title="完了にする">○</button>
      </li>`;
    }
    html += `</ul></div>`;
  }
  if (!totalTodo) html = '<div class="today-empty">今週やることはありません 🎉</div>';
  document.getElementById('weekList').innerHTML = html;
  openOv('ovWeek');
}
function toggleDoneFromWeek(batchId) {
  const b = batchById(batchId);
  if (!b) return;
  b.done = true;
  save();
  openWeekPanel(); // refresh
  setTimeout(render, 0);
}

// ─── Overlay helpers ─────────────────────────────────────────────────────────
function openOv(id) { document.getElementById(id).classList.add('open'); }
function closeOv(id) { document.getElementById(id).classList.remove('open'); }
function closeAllOv() { document.querySelectorAll('.overlay.open').forEach(el => el.classList.remove('open')); }
function ovClick(event, id) { if (event.target === event.currentTarget) closeOv(id); }

// ─── Sidebar toggle ───────────────────────────────────────────────────────────
let sidebarOpen = true;
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.querySelector('.sidebar').classList.toggle('collapsed', !sidebarOpen);
  document.getElementById('sbBackdrop').classList.toggle('show', sidebarOpen && isTouchDevice());
  document.getElementById('sidebarToggle').textContent = sidebarOpen ? '☰' : '☰';
}
function isTouchDevice() {
  return window.matchMedia('(hover: none), (pointer: coarse)').matches;
}

// ─── Install guide ─────────────────────────────────────────────────────────────
function checkInstallBanner() {
  try {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isStandalone = window.navigator.standalone === true;
    const dismissed = sessionStorage.getItem('installBannerDismissed');
    if (isIOS && !isStandalone && !dismissed) {
      setTimeout(() => {
        document.getElementById('installBanner').classList.add('show');
      }, 2000);
    }
  } catch(_) {}
}
function dismissInstallBanner() {
  document.getElementById('installBanner').classList.remove('show');
  try { sessionStorage.setItem('installBannerDismissed', '1'); } catch(_) {}
}

// ─── Toast ───────────────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─── 元に戻す（Undo） ─────────────────────────────────────────────────────────
let undoSnapshot = null, _undoTimer = null;
function snapshotForUndo() {
  undoSnapshot = JSON.stringify({ jobs: DB.jobs, staff: DB.staff, batches: DB.batches, jobNames: DB.jobNames, materials: DB.materials });
}
function showUndo(msg) {
  const bar = document.getElementById('undoBar');
  document.getElementById('undoMsg').textContent = msg;
  bar.classList.add('show');
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => bar.classList.remove('show'), 6000);
}
function hideUndo() { document.getElementById('undoBar').classList.remove('show'); clearTimeout(_undoTimer); }
function doUndo() {
  if (!undoSnapshot) { hideUndo(); return; }
  let s;
  try { s = JSON.parse(undoSnapshot); } catch (_) { hideUndo(); return; }
  DB.jobs = s.jobs; DB.staff = s.staff; DB.batches = s.batches; DB.jobNames = s.jobNames;
  if (Array.isArray(s.materials)) DB.materials = s.materials;
  undoSnapshot = null;
  hideUndo();
  save(); setTimeout(render, 0);
  try { if (document.getElementById('ovMat').classList.contains('open')) renderMaterials(); } catch(_) {}
  toast('元に戻しました');
}
</script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
